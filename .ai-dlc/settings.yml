# AI-DLC project settings — generated by /ai-dlc:setup
# Precedence: unit frontmatter > intent settings (.ai-dlc/{intent}/settings.yml) > this file.

git:
  # Each unit opens its own PR; dependent units wait until their deps are merged.
  change_strategy: unit
  default_branch: main
  # Autonomous workflow: proceed without a separate elaboration-review PR gate.
  elaboration_review: false

# Balanced unit decomposition.
granularity: standard

# Browser-based visual review at elaboration gates (ai-dlc-review MCP server, bundled).
visual_review: true

# Announcement formats generated when an intent completes.
default_announcements: [changelog]

# Cross-functional iteration passes for new intents: product framing, design, then dev.
default_passes: [product, design, dev]

# Optional review agents (core agents — security, performance, architecture,
# correctness, test_quality — are always on and need not be listed).
review_agents:
  data_integrity: true
  schema_drift: true
  accessibility: true
  api_contract: true

providers:
  ticketing:
    type: github-issues
