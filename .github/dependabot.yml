        update-types: ["major"]
      nightscout-gradle-minor:
        patterns: ["*"]
        update-types: ["minor"]
      nightscout-gradle-patch:
        patterns: ["*"]
        update-types: ["patch"]

  # ── kdiab-ui (unified SPA) ──────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/kdiab-ui"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "eslint"
        versions: [">= 10"]
      - dependency-name: "@eslint/js"
        versions: [">= 10"]
    groups:
      ui-npm-major:
        patterns: ["*"]
        update-types: ["major"]
      ui-npm-minor:
        patterns: ["*"]
        update-types: ["minor"]
      ui-npm-patch:
        patterns: ["*"]
        update-types: ["patch"]

  # ── Docker (root compose) ───────────────────────────────────────────────────
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "eclipse-temurin"
        versions: [">= 22"]
    groups:
      docker:
        patterns: ["*"]
