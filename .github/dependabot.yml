version: 2
updates:

  # ── GitHub Actions ──────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns: ["*"]

  # ── kdiab-measures ──────────────────────────────────────────────────────────
  - package-ecosystem: "gradle"
    directory: "/kdiab-measures"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "org.jetbrains.kotlin*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      measures-gradle-major:
        patterns: ["*"]
        update-types: ["major"]
      measures-gradle-minor:
        patterns: ["*"]
        update-types: ["minor"]
      measures-gradle-patch:
        patterns: ["*"]
        update-types: ["patch"]

  # ── kdiab-profiles ──────────────────────────────────────────────────────────
  - package-ecosystem: "gradle"
    directory: "/kdiab-profiles"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "org.jetbrains.kotlin*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "org.cyclonedx.bom"
        versions: [">= 3.2.3"]
    groups:
      profiles-gradle-major:
        patterns: ["*"]
        update-types: ["major"]
      profiles-gradle-minor:
        patterns: ["*"]
        update-types: ["minor"]
      profiles-gradle-patch:
        patterns: ["*"]
        update-types: ["patch"]

  # ── kdiab-treatments ────────────────────────────────────────────────────────
