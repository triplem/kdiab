version: 2
updates:

  # ── GitHub Actions ──────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns: ["*"]

  # ── kdiab-measures ──────────────────────────────────────────────────────────
  - package-ecosystem: "gradle"
    directory: "/kdiab-measures"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "org.jetbrains.kotlin*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      measures-gradle-major:
        patterns: ["*"]
        update-types: ["major"]
      measures-gradle-minor:
        patterns: ["*"]
        update-types: ["minor"]
      measures-gradle-patch:
        patterns: ["*"]
        update-types: ["patch"]

  - package-ecosystem: "npm"
    directory: "/kdiab-measures/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "eslint"
        versions: [">= 10"]
      - dependency-name: "@eslint/js"
        versions: [">= 10"]
    groups:
      measures-npm-major:
        patterns: ["*"]
        update-types: ["major"]
      measures-npm-minor:
        patterns: ["*"]
        update-types: ["minor"]
      measures-npm-patch:
        patterns: ["*"]
        update-types: ["patch"]

  - package-ecosystem: "docker"
    directory: "/kdiab-measures/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "eclipse-temurin"
        versions: [">= 22"]
    groups:
      measures-docker:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/kdiab-measures/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      measures-frontend-docker:
        patterns: ["*"]

