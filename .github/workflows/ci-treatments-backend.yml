name: kdiab-treatments / Backend CI

on:
  push:
    branches: [ "**" ]
    paths:
      - 'kdiab-treatments/src/**'
      - 'kdiab-treatments/gradle/**'
      - 'kdiab-treatments/api/openapi.yaml'
      - 'kdiab-treatments/build.gradle.kts'
      - 'kdiab-treatments/settings.gradle.kts'
      - 'kdiab-treatments/gradle.properties'
      - 'kdiab-common/src/**'
      - '.github/workflows/ci-treatments-backend.yml'
      - '.github/workflows/backend-ci-reusable.yml'
      - 'build-logic/**'
      - 'gradle/libs.versions.toml'
  pull_request:
    branches: [ "**" ]
    paths:
      - 'kdiab-treatments/src/**'
      - 'kdiab-treatments/gradle/**'
      - 'kdiab-treatments/api/openapi.yaml'
      - 'kdiab-treatments/build.gradle.kts'
      - 'kdiab-treatments/settings.gradle.kts'
      - 'kdiab-treatments/gradle.properties'
      - 'kdiab-common/src/**'
      - '.github/workflows/ci-treatments-backend.yml'
      - '.github/workflows/backend-ci-reusable.yml'
      - 'build-logic/**'
      - 'gradle/libs.versions.toml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  build:
    uses: ./.github/workflows/backend-ci-reusable.yml
    with:
      service: kdiab-treatments
      sonar_project_key: triplem_kdiab-treatments
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
