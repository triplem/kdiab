name: Deploy Documentation

on:
  push:
    branches: ["main"]
    paths:
      - 'docs/**'
      - 'kdiab-measures/docs/**'
      - 'kdiab-profiles/docs/**'
      - 'kdiab-treatments/docs/**'
      - 'kdiab-analyze/docs/**'
      - 'kdiab-users/docs/**'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install AsciiDoctor
        run: sudo gem install asciidoctor

      - name: Build measures docs
        run: cd kdiab-measures && ./gradlew asciidoctor --no-configuration-cache

      - name: Build profiles docs
        run: cd kdiab-profiles && ./gradlew asciidoctor --no-configuration-cache

      - name: Build treatments docs
        run: cd kdiab-treatments && ./gradlew asciidoctor --no-configuration-cache

      - name: Build analyze docs
        run: cd kdiab-analyze && ./gradlew asciidoctor --no-configuration-cache

      - name: Build users docs
        run: cd kdiab-users && ./gradlew asciidoctor --no-configuration-cache

      - name: Build root docs
        run: |
          mkdir -p pages/root pages/root/adr
          asciidoctor -D pages/root       docs/index.adoc docs/architecture.adoc docs/deployment.adoc docs/glossary.adoc docs/how-to-run.adoc docs/keycloak-setup.adoc
          asciidoctor -D pages/root/adr   docs/adr/*.adoc

      - name: Assemble pages
        run: |
          mkdir -p pages/measures pages/profiles pages/treatments pages/analyze pages/users
          cp -r kdiab-measures/build/docs/asciidoc/.  pages/measures/
          cp -r kdiab-profiles/build/docs/asciidoc/.  pages/profiles/
          cp -r kdiab-treatments/build/docs/asciidoc/. pages/treatments/
          cp -r kdiab-analyze/build/docs/asciidoc/.   pages/analyze/
          cp -r kdiab-users/build/docs/asciidoc/.     pages/users/
          cat > pages/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head><meta charset="UTF-8"><title>kdiab Documentation</title>
          <meta http-equiv="refresh" content="0; url=root/index.html">
          </head>
          <body>
          <p>Redirecting to <a href="root/index.html">platform documentation</a>…</p>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
