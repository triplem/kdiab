name: Deploy Documentation

on:
  push:
    branches: ["main"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  resolve-version:
    if: github.repository == 'triplem/kdiab'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Derive version from latest tag
        id: ver
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  build-root:
    if: github.repository == 'triplem/kdiab'
    needs: resolve-version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build root docs
        # (#661) Uses root Gradle asciidoctor task (bundles JRuby + gem) — no system gem install needed.
        run: ./gradlew asciidoctor -Pversion=${{ needs.resolve-version.outputs.version }}

      - name: Upload root docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-root
          path: build/docs/asciidoc/

  build-service:
    if: github.repository == 'triplem/kdiab'
    needs: resolve-version
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: kdiab-measures
            page: measures
          - service: kdiab-profiles
            page: profiles
          - service: kdiab-treatments
            page: treatments
          - service: kdiab-analyze
            page: analyze
          - service: kdiab-users
            page: users
          - service: kdiab-carbs
            page: carbs
          - service: kdiab-calc
            page: calc
          - service: kdiab-nightscout
            page: nightscout
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build ${{ matrix.service }} quality reports and docs
        continue-on-error: true
        run: cd ${{ matrix.service }} && ./gradlew check koverHtmlReport asciidoctor -Pversion=${{ needs.resolve-version.outputs.version }}

      - name: Generate ${{ matrix.service }} OpenAPI HTML
        continue-on-error: true
        run: cd ${{ matrix.service }} && npx @redocly/cli@2 build-docs api/openapi.yaml --output openapi.html

      - name: Set up Docker Buildx
        continue-on-error: true
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} Docker image
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          load: true
          tags: kdiab/${{ matrix.page }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy vulnerability scan — ${{ matrix.service }}
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: kdiab/${{ matrix.page }}:scan
          format: template
          template: '@/contrib/html.tpl'
          output: ${{ matrix.service }}/trivy-report.html
          exit-code: 0
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true

      - name: Stage ${{ matrix.service }} reports
        if: always()
        run: |
          PAGE=${{ matrix.page }}
          SVC=${{ matrix.service }}
          mkdir -p staging/${PAGE}/reports/detekt
          mkdir -p staging/${PAGE}/reports/coverage
          mkdir -p staging/${PAGE}/reports/tests/unit
          mkdir -p staging/${PAGE}/reports/tests/integration
          mkdir -p staging/${PAGE}/reports/tests/e2e
          mkdir -p staging/${PAGE}/reports

          # AsciiDoc HTML → page root
          if [ -d "${SVC}/build/docs/asciidoc" ]; then
            cp -r ${SVC}/build/docs/asciidoc/. staging/${PAGE}/
          fi

          # Detekt HTML report
          if [ -d "${SVC}/build/reports/detekt" ]; then
            cp -r ${SVC}/build/reports/detekt/. staging/${PAGE}/reports/detekt/
          fi

          # Kover HTML coverage report
          if [ -d "${SVC}/build/reports/kover/html" ]; then
            cp -r ${SVC}/build/reports/kover/html/. staging/${PAGE}/reports/coverage/
          fi

          # Gradle unit test report
          if [ -d "${SVC}/build/reports/tests/test" ]; then
            cp -r ${SVC}/build/reports/tests/test/. staging/${PAGE}/reports/tests/unit/
          fi

          # Gradle integration test report
          if [ -d "${SVC}/build/reports/tests/integrationTest" ]; then
            cp -r ${SVC}/build/reports/tests/integrationTest/. staging/${PAGE}/reports/tests/integration/
          fi

          # Gradle e2e test report
          if [ -d "${SVC}/build/reports/tests/e2eTest" ]; then
            cp -r ${SVC}/build/reports/tests/e2eTest/. staging/${PAGE}/reports/tests/e2e/
          fi

          # OpenAPI HTML
          if [ -f "${SVC}/openapi.html" ]; then
            cp ${SVC}/openapi.html staging/${PAGE}/openapi.html
          fi

          # Trivy HTML report
          if [ -f "${SVC}/trivy-report.html" ]; then
            cp ${SVC}/trivy-report.html staging/${PAGE}/reports/trivy.html
          fi

      - name: Upload ${{ matrix.service }} reports artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-${{ matrix.page }}
          path: staging/${{ matrix.page }}/
          if-no-files-found: ignore

  build-common:
    if: github.repository == 'triplem/kdiab'
    needs: resolve-version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build kdiab-common quality reports
        continue-on-error: true
        run: cd kdiab-common && ./gradlew check koverHtmlReport

      - name: Stage kdiab-common reports
        if: always()
        run: |
          mkdir -p staging/common/reports/detekt
          mkdir -p staging/common/reports/coverage
          mkdir -p staging/common/reports/tests/unit

          if [ -d "kdiab-common/build/reports/detekt" ]; then
            cp -r kdiab-common/build/reports/detekt/. staging/common/reports/detekt/
          fi

          if [ -d "kdiab-common/build/reports/kover/html" ]; then
            cp -r kdiab-common/build/reports/kover/html/. staging/common/reports/coverage/
          fi

          if [ -d "kdiab-common/build/reports/tests/test" ]; then
            cp -r kdiab-common/build/reports/tests/test/. staging/common/reports/tests/unit/
          fi

      - name: Upload kdiab-common reports artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-common
          path: staging/common/
          if-no-files-found: ignore

  build-ui-reports:
    if: github.repository == 'triplem/kdiab'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: cd kdiab-ui && npm ci

      - name: Generate API clients
        run: cd kdiab-ui && npm run api:generate

      - name: Run Vitest coverage
        continue-on-error: true
        run: cd kdiab-ui && npm run test:coverage

      - name: Run ESLint HTML report
        continue-on-error: true
        run: cd kdiab-ui && npx eslint . --format html --output-file eslint-report.html || true

      - name: Set up Docker Buildx
        continue-on-error: true
        uses: docker/setup-buildx-action@v3

      - name: Build kdiab-ui Docker image
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: kdiab-ui
          load: true
          tags: kdiab/ui:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy vulnerability scan — kdiab-ui
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: kdiab/ui:scan
          format: template
          template: '@/contrib/html.tpl'
          output: kdiab-ui/trivy-report.html
          exit-code: 0
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true

      - name: Stage kdiab-ui reports
        if: always()
        run: |
          mkdir -p staging/ui/reports/coverage

          if [ -d "kdiab-ui/coverage" ]; then
            cp -r kdiab-ui/coverage/. staging/ui/reports/coverage/
          fi

          if [ -f "kdiab-ui/eslint-report.html" ]; then
            cp kdiab-ui/eslint-report.html staging/ui/reports/eslint.html
          fi

          if [ -f "kdiab-ui/trivy-report.html" ]; then
            cp kdiab-ui/trivy-report.html staging/ui/reports/trivy.html
          fi

      - name: Upload kdiab-ui reports artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-ui
          path: staging/ui/
          if-no-files-found: ignore

  assemble:
    if: github.repository == 'triplem/kdiab'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-root, build-service, build-common, build-ui-reports]
    steps:
      - name: Download root docs
        uses: actions/download-artifact@v4
        with:
          name: docs-root
          path: pages/root/

      - name: Download measures docs
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: docs-measures
          path: pages/measures/

      - name: Download profiles docs
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: docs-profiles
          path: pages/profiles/

      - name: Download treatments docs
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: docs-treatments
          path: pages/treatments/

      - name: Download analyze docs
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: docs-analyze
          path: pages/analyze/

      - name: Download users docs
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: docs-users
          path: pages/users/

      - name: Download carbs docs
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: docs-carbs
          path: pages/carbs/

      - name: Download calc docs
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: docs-calc
          path: pages/calc/

      - name: Download nightscout docs
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: docs-nightscout
          path: pages/nightscout/

      - name: Download common docs
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: docs-common
          path: pages/common/

      - name: Download ui reports
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: docs-ui
          path: pages/ui/

      - name: Create index page
        run: |
          cat > pages/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head><meta charset="UTF-8"><title>kdiab Documentation</title>
          <meta http-equiv="refresh" content="0; url=root/index.html">
          </head>
          <body>
          <p>Redirecting to <a href="root/index.html">platform documentation</a>…</p>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages/

  deploy:
    if: github.repository == 'triplem/kdiab'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: assemble
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
