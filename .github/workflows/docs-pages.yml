name: Deploy Documentation

on:
  push:
    branches: ["main"]
    paths:
      - 'kdiab-measures/docs/**'
      - 'kdiab-measures/backend/docs/**'
      - 'kdiab-profiles/docs/**'
      - 'kdiab-profiles/backend/docs/**'
      - 'kdiab-treatments/docs/**'
      - 'kdiab-treatments/backend/docs/**'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build measures docs
        run: cd kdiab-measures && ./gradlew asciidoctor --no-configuration-cache

      - name: Build profiles docs
        run: cd kdiab-profiles && ./gradlew asciidoctor --no-configuration-cache

      - name: Build treatments docs
        run: cd kdiab-treatments && ./gradlew asciidoctor --no-configuration-cache

      - name: Assemble pages
        run: |
          mkdir -p pages/measures pages/profiles pages/treatments
          cp -r kdiab-measures/build/docs/asciidoc/. pages/measures/
          cp -r kdiab-profiles/build/docs/asciidoc/. pages/profiles/
          cp -r kdiab-treatments/build/docs/asciidoc/. pages/treatments/
          cat > pages/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head><meta charset="UTF-8"><title>kdiab Documentation</title></head>
          <body>
          <h1>kdiab Documentation</h1>
          <ul>
            <li><a href="measures/">kdiab-measures</a></li>
            <li><a href="profiles/">kdiab-profiles</a></li>
            <li><a href="treatments/">kdiab-treatments</a></li>
          </ul>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
