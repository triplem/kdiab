name: Deploy Documentation

on:
  push:
    branches: ["main"]
    paths:
      - 'docs/**'
      - 'kdiab-measures/docs/**'
      - 'kdiab-profiles/docs/**'
      - 'kdiab-treatments/docs/**'
      - 'kdiab-analyze/docs/**'
      - 'kdiab-carbs/docs/**'
      - 'kdiab-calc/docs/**'
      - 'kdiab-nightscout/docs/**'
      - 'kdiab-users/docs/**'
      - '.github/workflows/docs-pages.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-root:
    if: github.repository == 'triplem/kdiab'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build root docs
        # (#661) Uses root Gradle asciidoctor task (bundles JRuby + gem) — no system gem install needed.
        run: ./gradlew asciidoctor

      - name: Upload root docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-root
          path: build/docs/asciidoc/

  build-service:
    if: github.repository == 'triplem/kdiab'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - service: kdiab-measures
            page: measures
          - service: kdiab-profiles
            page: profiles
          - service: kdiab-treatments
            page: treatments
          - service: kdiab-analyze
            page: analyze
          - service: kdiab-users
            page: users
          - service: kdiab-carbs
            page: carbs
          - service: kdiab-calc
            page: calc
          - service: kdiab-nightscout
            page: nightscout
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build ${{ matrix.service }} docs
        run: cd ${{ matrix.service }} && ./gradlew asciidoctor

      - name: Upload ${{ matrix.service }} docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-${{ matrix.page }}
          path: ${{ matrix.service }}/build/docs/asciidoc/

  assemble:
    if: github.repository == 'triplem/kdiab'
    runs-on: ubuntu-latest
    needs: [build-root, build-service]
    steps:
      - name: Download root docs
        uses: actions/download-artifact@v4
        with:
          name: docs-root
          path: pages/root/

      - name: Download measures docs
        uses: actions/download-artifact@v4
        with:
          name: docs-measures
          path: pages/measures/

      - name: Download profiles docs
        uses: actions/download-artifact@v4
        with:
          name: docs-profiles
          path: pages/profiles/

      - name: Download treatments docs
        uses: actions/download-artifact@v4
        with:
          name: docs-treatments
          path: pages/treatments/

      - name: Download analyze docs
        uses: actions/download-artifact@v4
        with:
          name: docs-analyze
          path: pages/analyze/

      - name: Download users docs
        uses: actions/download-artifact@v4
        with:
          name: docs-users
          path: pages/users/

      - name: Download carbs docs
        uses: actions/download-artifact@v4
        with:
          name: docs-carbs
          path: pages/carbs/

      - name: Download calc docs
        uses: actions/download-artifact@v4
        with:
          name: docs-calc
          path: pages/calc/

      - name: Download nightscout docs
        uses: actions/download-artifact@v4
        with:
          name: docs-nightscout
          path: pages/nightscout/

      - name: Create index page
        run: |
          cat > pages/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head><meta charset="UTF-8"><title>kdiab Documentation</title>
          <meta http-equiv="refresh" content="0; url=root/index.html">
          </head>
          <body>
          <p>Redirecting to <a href="root/index.html">platform documentation</a>…</p>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages/

  deploy:
    if: github.repository == 'triplem/kdiab'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: assemble
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
