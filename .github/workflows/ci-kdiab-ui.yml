name: kdiab-ui / CI

on:
  push:
    branches: [ "**" ]
    paths:
      - 'kdiab-ui/**'
      - 'kdiab-measures/api/openapi.yaml'
      - 'kdiab-profiles/api/openapi.yaml'
      - 'kdiab-treatments/api/openapi.yaml'
      - 'kdiab-analyze/api/openapi.yaml'
      - '.github/workflows/ci-kdiab-ui.yml'
  pull_request:
    branches: [ "**" ]
    paths:
      - 'kdiab-ui/**'
      - 'kdiab-measures/api/openapi.yaml'
      - 'kdiab-profiles/api/openapi.yaml'
      - 'kdiab-treatments/api/openapi.yaml'
      - 'kdiab-analyze/api/openapi.yaml'
      - '.github/workflows/ci-kdiab-ui.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: kdiab-ui
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: kdiab-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high
        working-directory: kdiab-ui

      - name: Determine Version
        run: |
          if [[ "${{ github.ref }}" == 'refs/heads/main' ]]; then
            echo "VERSION=latest" >> $GITHUB_ENV
          else
            BRANCH_NAME=${GITHUB_REF#refs/heads/}
            SAFE_BRANCH_NAME=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9]/-/g' | tr '[:upper:]' '[:lower:]')
            SHORT_SHA=$(git rev-parse --short HEAD)
            echo "VERSION=${SAFE_BRANCH_NAME}-${SHORT_SHA}-SNAPSHOT" >> $GITHUB_ENV
          fi

      - name: Generate API Clients
        run: npm run api:generate

      - name: Lint
        run: npm run lint

      - name: Run Tests
        run: npm test -- --run --coverage

      - name: Build
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker Image
        uses: docker/build-push-action@v7
        with:
          context: kdiab-ui
          file: kdiab-ui/Dockerfile
          push: false
          tags: |
            kdiab-ui:latest
            kdiab-ui:${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/kdiab-ui-image.tar

      - name: Upload Docker Image
        uses: actions/upload-artifact@v7
        with:
          name: kdiab-ui-image
          path: /tmp/kdiab-ui-image.tar
          retention-days: 7

      - name: Scan Docker Image
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: /tmp/kdiab-ui-image.tar
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload Trivy scan results to GitHub Security tab
        if: always() && hashFiles('trivy-results.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Generate SBOM
        run: npm run cyclonedx

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: kdiab-ui-bom
          path: kdiab-ui/bom.json
          retention-days: 7
