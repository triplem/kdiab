name: kdiab-measures / Backend CI

on:
  push:
    branches: [ "**" ]
    paths:
      - 'kdiab-measures/src/**'
      - 'kdiab-measures/gradle/**'
      - 'kdiab-measures/api/openapi.yaml'
      - 'kdiab-measures/build.gradle.kts'
      - 'kdiab-measures/settings.gradle.kts'
      - 'kdiab-measures/gradle.properties'
      - 'kdiab-common/src/**'
      - '.github/workflows/ci-measures-backend.yml'
      - '.github/workflows/backend-ci-reusable.yml'
      - 'buildSrc/**'
      - 'gradle/libs.versions.toml'
  pull_request:
    branches: [ "**" ]
    paths:
      - 'kdiab-measures/src/**'
      - 'kdiab-measures/gradle/**'
      - 'kdiab-measures/api/openapi.yaml'
      - 'kdiab-measures/build.gradle.kts'
      - 'kdiab-measures/settings.gradle.kts'
      - 'kdiab-measures/gradle.properties'
      - 'kdiab-common/src/**'
      - '.github/workflows/ci-measures-backend.yml'
      - '.github/workflows/backend-ci-reusable.yml'
      - 'buildSrc/**'
      - 'gradle/libs.versions.toml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  build:
    uses: ./.github/workflows/backend-ci-reusable.yml
    with:
      service: kdiab-measures
      sonar_project_key: triplem_kdiab-measures
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
