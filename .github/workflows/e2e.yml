name: kdiab-ui / E2E

on:
  # Disabled on pull_request: postgres container healthcheck is unreliable on
  # GitHub Actions runners (issue #1152). Re-enable once the healthcheck is fixed.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright E2E (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Build backend JARs
        run: ./gradlew buildBackends --no-parallel
        env:
          GRADLE_OPTS: "-Xmx3g -XX:MaxMetaspaceSize=512m"

      - name: Start kdiab stack
        run: |
          docker compose -f docker-compose.yml up --build -d --wait
        env:
          COMPOSE_HTTP_TIMEOUT: 300

      - name: Wait for services to be reachable
        run: |
          declare -A services=(
            ["kdiab-ui"]="http://localhost:3005/"
            ["keycloak"]="http://localhost:8081/"
            ["kdiab-measures"]="http://localhost:8080/swagger"
            ["kdiab-profiles"]="http://localhost:8082/swagger"
            ["kdiab-treatments"]="http://localhost:8083/swagger"
            ["kdiab-analyze"]="http://localhost:8084/swagger"
            ["kdiab-calc"]="http://localhost:8086/swagger"
            ["kdiab-users"]="http://localhost:8088/swagger"
          )
          for name in "${!services[@]}"; do
            url="${services[$name]}"
            for i in $(seq 1 30); do
              if curl -sf "$url" > /dev/null 2>&1; then
                echo "$name is up ($url)"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "ERROR: $name did not become reachable at $url" >&2
                exit 1
              fi
              echo "Waiting for $name... attempt $i"
              sleep 5
            done
          done

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: kdiab-ui/package-lock.json

      - name: Install dependencies
        working-directory: kdiab-ui
        run: npm ci

      - name: Generate API Clients
        working-directory: kdiab-ui
        run: npm run api:generate

      - name: Install Playwright Chromium
        working-directory: kdiab-ui
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        working-directory: kdiab-ui
        run: npx playwright test --project=setup --project=chromium
        env:
          BASE_URL: http://localhost:3005

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: kdiab-ui/playwright-report/
          retention-days: 7

      - name: Stop stack
        if: always()
        run: docker compose -f docker-compose.yml down -v
