name: Backend CI (reusable)

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      sonar_project_key:
        required: true
        type: string
      sonar_tests:
        required: false
        type: string
        default: 'src/test/kotlin,src/e2e-test/kotlin,src/integration-test/kotlin'
    secrets:
      SONAR_TOKEN:
        required: false

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Determine Version
        run: |
          if [[ "$GITHUB_REF" == 'refs/heads/main' ]]; then
            echo "VERSION=latest" >> $GITHUB_ENV
          else
            BRANCH_NAME=${GITHUB_REF#refs/heads/}
            SAFE_BRANCH_NAME=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9]/-/g' | tr '[:upper:]' '[:lower:]')
            SHORT_SHA=$(git rev-parse --short HEAD)
            echo "VERSION=${SAFE_BRANCH_NAME}-${SHORT_SHA}-SNAPSHOT" >> $GITHUB_ENV
          fi

      - name: Build and Test
        env:
          SERVICE: ${{ inputs.service }}
        run: cd "$SERVICE" && ./gradlew :check :koverVerify :buildFatJar :cyclonedxBom -Pversion="$VERSION"

      - name: Upload Detekt results to GitHub Security tab
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: ${{ inputs.service }}/build/reports/detekt/detekt.sarif
          category: detekt-${{ inputs.service }}

      - name: SonarCloud Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarcloud-github-action@ffc3010689be73b8e5ae0c57ce35968afd7909e8 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: ${{ inputs.service }}
          args: >
            -Dsonar.projectKey=${{ inputs.sonar_project_key }}
            -Dsonar.organization=triplem
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.sources=src/main/kotlin
            -Dsonar.tests=${{ inputs.sonar_tests }}
            -Dsonar.java.binaries=build/classes/kotlin/main
            -Dsonar.coverage.jacoco.xmlReportPaths=build/reports/kover/report.xml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build Docker Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ inputs.service }}
          file: ${{ inputs.service }}/Dockerfile
          push: false
          tags: |
            ${{ inputs.service }}-backend:latest
            ${{ inputs.service }}-backend:${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/backend-image.tar

      - name: Derive short service name
        id: svc
        # Strip the kdiab- prefix so the uploaded artifact names match what
        # release.yml downloads (<service>-backend-{image,bom}). Kept separate from
        # inputs.service, which the image tags above still use unchanged. (#1617)
        run: echo "short=${SERVICE#kdiab-}" >> "$GITHUB_OUTPUT"
        env:
          SERVICE: ${{ inputs.service }}

      - name: Upload Docker Image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.svc.outputs.short }}-backend-image
          path: /tmp/backend-image.tar
          retention-days: 7

      - name: Scan Docker Image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: 'v0.74.0'
          input: /tmp/backend-image.tar
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          # Apply the severity filter to the SARIF output too. Without this the
          # SARIF (and thus exit-code) includes LOW/MEDIUM findings, so the gate
          # fails on sub-threshold CVEs despite severity being CRITICAL,HIGH.
          limit-severities-for-sarif: true
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Upload Trivy scan results to GitHub Security tab
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.svc.outputs.short }}-backend-bom
          path: ${{ inputs.service }}/build/reports/cyclonedx/bom.json
          retention-days: 7
