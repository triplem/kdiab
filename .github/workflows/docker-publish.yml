name: Publish Docker Images to ghcr.io

on:
  workflow_run:
    workflows:
      - "kdiab-users / Backend CI"
      - "kdiab-measures / Backend CI"
      - "kdiab-nightscout / Backend CI"
      - "kdiab-analyze / Backend CI"
      - "kdiab-profiles / Backend CI"
      - "kdiab-treatments / Backend CI"
      - "kdiab-carbs / Backend CI"
      - "kdiab-calc / Backend CI"
      - "kdiab-ui / CI"
    types: [completed]
    branches: [main]
  release:
    types:
      - published
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  checks: read

jobs:
  gate:
    name: Verify all CI checks passed
    runs-on: ubuntu-latest
    # Skip entirely if the triggering workflow itself failed
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      should_publish: ${{ steps.check.outputs.result }}
    steps:
      - name: Check all CI check-runs on this commit
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.event_name }}" != "workflow_run" ]]; then
            echo "result=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sha="${{ github.event.workflow_run.head_sha }}"
          # Count check-runs that are not yet in a terminal success/skipped/neutral state.
          # workflow_run fires once per upstream workflow; this gate blocks until all others
          # have also completed successfully before any images are published.
          pending=$(gh api \
            "repos/${{ github.repository }}/commits/${sha}/check-runs" \
            --paginate \
            --jq '[.check_runs[] | select(
              .name != "Verify all CI checks passed" and
              (.status != "completed" or
               (.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral"))
            )] | length')
          if [[ "$pending" -gt 0 ]]; then
            echo "result=false" >> "$GITHUB_OUTPUT"
          else
            echo "result=true" >> "$GITHUB_OUTPUT"
          fi

  publish-backends:
    needs: gate
    name: Publish ${{ matrix.service }} backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ needs.gate.outputs.should_publish == 'true' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: kdiab-measures
            image: measures
          - service: kdiab-profiles
            image: profiles
          - service: kdiab-treatments
            image: treatments
          - service: kdiab-analyze
            image: analyze
          - service: kdiab-carbs
            image: carbs
          - service: kdiab-calc
            image: calc
          - service: kdiab-nightscout
            image: nightscout
          - service: kdiab-users
            image: users

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/kdiab-${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern=v{{version}}
            type=sha,prefix=sha-,format=short

      - name: Build fat JAR
        run: cd ${{ matrix.service }} && ./gradlew build -x test -x koverVerify

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-ui:
    needs: gate
    name: Publish kdiab-ui frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ needs.gate.outputs.should_publish == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/kdiab-ui
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern=v{{version}}
            type=sha,prefix=sha-,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./kdiab-ui
          file: ./kdiab-ui/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
