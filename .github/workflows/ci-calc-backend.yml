name: kdiab-calc / Backend CI

on:
  push:
    branches: [ "**" ]
    paths:
      - 'kdiab-calc/src/**'
      - 'kdiab-calc/gradle/**'
      - 'kdiab-calc/api/openapi.yaml'
      - 'kdiab-calc/build.gradle.kts'
      - 'kdiab-calc/settings.gradle.kts'
      - 'kdiab-calc/gradle.properties'
      - 'kdiab-common/src/**'
      - '.github/workflows/ci-calc-backend.yml'
      - '.github/workflows/backend-ci-reusable.yml'
      - 'build-logic/**'
      - 'gradle/libs.versions.toml'
  pull_request:
    branches: [ "**" ]
    paths:
      - 'kdiab-calc/src/**'
      - 'kdiab-calc/gradle/**'
      - 'kdiab-calc/api/openapi.yaml'
      - 'kdiab-calc/build.gradle.kts'
      - 'kdiab-calc/settings.gradle.kts'
      - 'kdiab-calc/gradle.properties'
      - 'kdiab-common/src/**'
      - '.github/workflows/ci-calc-backend.yml'
      - '.github/workflows/backend-ci-reusable.yml'
      - 'build-logic/**'
      - 'gradle/libs.versions.toml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  build:
    uses: ./.github/workflows/backend-ci-reusable.yml
    with:
      service: kdiab-calc
      sonar_project_key: triplem_kdiab-calc
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
