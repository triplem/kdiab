name: kdiab-bff / Backend CI

on:
  push:
    branches: [ "**" ]
    paths:
      - 'kdiab-bff/backend/**'
      - 'kdiab-bff/gradle/**'
      - 'kdiab-bff/api/openapi.yaml'
      - 'kdiab-bff/build.gradle.kts'
      - 'kdiab-bff/settings.gradle.kts'
      - 'kdiab-bff/gradle.properties'
      - '.github/workflows/ci-bff-backend.yml'
  pull_request:
    branches: [ "**" ]
    paths:
      - 'kdiab-bff/backend/**'
      - 'kdiab-bff/gradle/**'
      - 'kdiab-bff/api/openapi.yaml'
      - 'kdiab-bff/build.gradle.kts'
      - 'kdiab-bff/settings.gradle.kts'
      - 'kdiab-bff/gradle.properties'
      - '.github/workflows/ci-bff-backend.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Determine Version
        run: |
          if [[ "${{ github.ref }}" == 'refs/heads/main' ]]; then
            echo "VERSION=latest" >> $GITHUB_ENV
          else
            BRANCH_NAME=${GITHUB_REF#refs/heads/}
            SAFE_BRANCH_NAME=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9]/-/g' | tr '[:upper:]' '[:lower:]')
            SHORT_SHA=$(git rev-parse --short HEAD)
            echo "VERSION=${SAFE_BRANCH_NAME}-${SHORT_SHA}-SNAPSHOT" >> $GITHUB_ENV
          fi

      - name: Build and Test
        run: cd kdiab-bff && ./gradlew :backend:check :backend:cyclonedxBom -Pversion=${{ env.VERSION }}

      - name: SonarCloud Scan
        if: ${{ secrets.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarcloud-github-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: kdiab-bff/backend
          args: >
            -Dsonar.projectKey=triplem_kdiab-bff
            -Dsonar.organization=triplem
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.sources=src/main/kotlin
            -Dsonar.tests=src/test/kotlin,src/e2e-test/kotlin,src/integration-test/kotlin
            -Dsonar.java.binaries=build/classes/kotlin/main
            -Dsonar.coverage.jacoco.xmlReportPaths=build/reports/kover/report.xml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker Image
        uses: docker/build-push-action@v7
        with:
          context: kdiab-bff
          file: kdiab-bff/backend/Dockerfile
          push: false
          tags: |
            kdiab-bff-backend:latest
            kdiab-bff-backend:${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/backend-image.tar

      - name: Upload Docker Image
        uses: actions/upload-artifact@v4
        with:
          name: bff-backend-image
          path: /tmp/backend-image.tar
          retention-days: 7

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: bff-backend-bom
          path: kdiab-bff/backend/build/reports/cyclonedx/bom.json
          retention-days: 7
