server {
    listen 8080;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # KEYCLOAK_URL is injected at container startup via envsubst (see Dockerfile).
    # connect-src: OIDC library fetches discovery doc + token endpoint from Keycloak.
    # frame-src: automaticSilentRenew uses a hidden iframe pointed at Keycloak.
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ${KEYCLOAK_URL}; frame-src 'self' ${KEYCLOAK_URL}; style-src 'self'; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:;" always;

    # index.html must always revalidate so browsers pick up new asset hashes after a deploy.
    location = /index.html {
        root  /usr/share/nginx/html;
        add_header Cache-Control "no-cache" always;
    }

    # Hashed asset filenames are content-addressed — cache forever, no revalidation needed.
    location /assets/ {
        root  /usr/share/nginx/html;
        add_header Cache-Control "max-age=31536000, immutable" always;
    }

    location /api/measures/ {
        proxy_pass         http://measures-backend:8080/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    location /api/profiles/ {
        proxy_pass         http://profiles-backend:8080/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    location /api/treatments/ {
        proxy_pass         http://treatments-backend:8080/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    location /api/analyze/ {
        proxy_pass         http://analyze-backend:8080/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }
}
