# Rate limiting zones — defined at http{} level (this file is included inside http{}).
# General API zone: 30 requests/min per client IP, 10m shared memory.
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
# Calc zone: tighter limit for the computationally non-trivial dose endpoint.
limit_req_zone $binary_remote_addr zone=calc:10m rate=10r/m;
# Return 429 instead of nginx default 503 when rate limit is exceeded.
limit_req_status 429;

server {
    listen 8080;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # KEYCLOAK_URL is injected at container startup via envsubst (see Dockerfile).
    # default-src: baseline fallback for any directive not listed below.
    # script-src:  only same-origin scripts allowed (explicit, not relying on default-src fallback).
    # connect-src: OIDC library fetches discovery doc + token endpoint from Keycloak.
    # frame-src:   automaticSilentRenew uses a hidden iframe pointed at Keycloak.
    # style-src:   same-origin stylesheets only.
    # font-src:    local fonts + Google Fonts static assets.
    # img-src:     same-origin + data: URIs (inline SVG/chart icons).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self' ${KEYCLOAK_URL}; frame-src 'self' ${KEYCLOAK_URL}; style-src 'self'; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:;" always;

    # Custom error page for upstream failures.
    error_page 502 503 504 /error.html;
    location = /error.html {
        root  /usr/share/nginx/html;
        internal;
        add_header Cache-Control "no-store" always;
    }

    # 429 Too Many Requests — advise client to retry after 60 s.
    # NOTE: limit_req is only set on /api/* location blocks (see below); the root
    # location / has no rate limiting, so HTML/SPA routes can never trigger a 429.
    # The JSON response body is intentional: every 429 comes from an API call made
    # by the React app's Axios layer, which expects a JSON error payload.
    error_page 429 @too_many_requests;
    location @too_many_requests {
        add_header Retry-After 60 always;
        add_header Content-Type "application/json" always;
        return 429 '{"error":"Too Many Requests","retryAfter":60}';
    }

    # index.html must always revalidate so browsers pick up new asset hashes after a deploy.
    location = /index.html {
        root  /usr/share/nginx/html;
        add_header Cache-Control "no-cache" always;
    }

    # Hashed asset filenames are content-addressed — cache forever, no revalidation needed.
    location /assets/ {
        root  /usr/share/nginx/html;
        add_header Cache-Control "max-age=31536000, immutable" always;
    }

    location /api/measures/ {
        limit_req zone=api burst=10 nodelay;
        proxy_pass         http://measures-backend:8080/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    location /api/profiles/ {
        limit_req zone=api burst=10 nodelay;
        proxy_pass         http://profiles-backend:8080/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    location /api/treatments/ {
        limit_req zone=api burst=10 nodelay;
        proxy_pass         http://treatments-backend:8080/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    location /api/analyze/ {
        limit_req zone=api burst=10 nodelay;
        proxy_pass         http://analyze-backend:8080/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    location /api/calc/ {
        # Tighter rate limit: dose calculation is CPU + network intensive.
        limit_req zone=calc burst=3 nodelay;
        proxy_pass         http://calc-backend:8086/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    location /api/carbs/ {
        limit_req zone=api burst=10 nodelay;
        proxy_pass         http://carbs-backend:8085/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    location /api/users/ {
        limit_req zone=api burst=10 nodelay;
        proxy_pass         http://users-backend:8088/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }
}
