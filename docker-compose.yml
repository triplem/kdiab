      JWT_DOMAIN: http://localhost:8081/realms/kdiab
      JWKS_URL: http://keycloak:8080/realms/kdiab/protocol/openid-connect/certs
      JWT_AUDIENCE: profile
      JWT_REALM: kdiab
      CORS_ALLOWED_ORIGINS: http://localhost:3005
      OTEL_SERVICE_NAME: kdiab-profiles
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-none}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-none}
      OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-none}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4317}
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      pg-seed:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
    networks:
      - shared
      - kdiab-ui-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'

  treatments-backend:
    container_name: kdiab-treatments-backend
    image: localhost/kdiab-treatments-backend:latest
    build:
      context: ./kdiab-treatments
      dockerfile: Dockerfile
    environment:
      JDBC_URL: jdbc:postgresql://postgres:5432/kdiab-treatments
      DB_USER: kdiab_treatments
      DB_PASSWORD: ${TREATMENTS_DB_PASSWORD}
      JWT_DOMAIN: http://localhost:8081/realms/kdiab
      JWKS_URL: http://keycloak:8080/realms/kdiab/protocol/openid-connect/certs
      JWT_AUDIENCE: treatment
      JWT_REALM: kdiab
      CORS_ALLOWED_ORIGINS: http://localhost:3005
      OTEL_SERVICE_NAME: kdiab-treatments
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-none}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-none}
      OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-none}
