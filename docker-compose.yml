# =============================================================================
# kdiab — Full-stack integration compose
#
# Starts all services with a shared Keycloak realm and a single PostgreSQL
# instance containing all three service databases, pre-seeded with 30 days
# of realistic CGM + treatment + profile data for sarah and mike.
#
# Service URLs (after startup):
#   Keycloak Admin:       http://localhost:8081  (admin / admin)
#   pgAdmin:              http://localhost:5050   (opt-in: add -f docker-compose.pgadmin.yml)
#   kdiab-ui (unified):    http://localhost:3005
#   Measures   API:    http://localhost:8080
#   Profiles   API:    http://localhost:8082
#   Treatments API:    http://localhost:8083
#   Analyze    API:    http://localhost:8084
#
# Test accounts (password: password):
#   sarah      PATIENT (mg/dL)
#   mike       PATIENT (mmol/L)
#   dr_house   DOCTOR  (assigned to sarah)
#   dr_cameron DOCTOR  (assigned to mike)
#   admin      ADMIN
#
# Shared Keycloak realm: kdiab
# The BFF client token carries all four JWT audiences (analyze, measure, profile,
# treatment) so it can forward the user's JWT to every upstream service.
#
# Prerequisites: copy .env.example to .env and set real values before first run.
# =============================================================================

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    container_name: kdiab-postgres
    image: docker.io/library/postgres:15.18@sha256:aba1c9eb4194ee600e1bd492aa7ad37b51d544eaeaeb2e2dee3a65a333cd174e
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      # Per-service role passwords — passed to 01-init-databases.sh at first startup.
      MEASURES_DB_PASSWORD: ${MEASURES_DB_PASSWORD}
      PROFILES_DB_PASSWORD: ${PROFILES_DB_PASSWORD}
      TREATMENTS_DB_PASSWORD: ${TREATMENTS_DB_PASSWORD}
      CARBS_DB_PASSWORD: ${CARBS_DB_PASSWORD}
      USERS_DB_PASSWORD: ${USERS_DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres/01-init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shared
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'
        reservations:
          memory: 512M
          cpus: '1.0'

  keycloak:
    container_name: kdiab-keycloak
    image: quay.io/keycloak/keycloak:26.6.1@sha256:dea26401d06341095cc4ea9d66896200b55de5ca1daa1d2fcbe58493afa6e0ad
    # start-dev: intentional for local development only. Not for production.
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_USERS_SERVICE_SECRET: ${KEYCLOAK_USERS_SERVICE_SECRET:-change-me-in-production}
      KC_LOG_CONSOLE_OUTPUT: json
      KC_TRACING_ENABLED: ${KC_TRACING_ENABLED:-false}
      # KC_TRACING_ENDPOINT and sampler settings are only effective when KC_TRACING_ENABLED=true
      # Uses KC_OTEL_ENDPOINT (HTTP/4318) separately from backends (gRPC/4317)
      KC_TRACING_ENDPOINT: ${KC_OTEL_ENDPOINT:-http://localhost:4318}
    volumes:
      - ./config/keycloak-realm.json:/opt/keycloak/data/import/realm.json:ro
      - ./config/keycloak-theme:/opt/keycloak/themes/kdiab:ro
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      - shared
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'

  # ── Schema migrations ───────────────────────────────────────────────────────

  liquibase-measures:
    container_name: kdiab-measures-liquibase
    image: localhost/kdiab-measures-liquibase:latest
    build:
      context: ./kdiab-measures
      dockerfile: Dockerfile.liquibase
    command: >
      --url=jdbc:postgresql://postgres:5432/kdiab-measures
      --username=${POSTGRES_USER:-postgres}
      --password=${POSTGRES_PASSWORD}
      --search-path=/liquibase
      --changelog-file=db/changelog/db.changelog-root.yaml
      update
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shared
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  liquibase-profiles:
    container_name: kdiab-profiles-liquibase
    image: localhost/kdiab-profiles-liquibase:latest
    build:
      context: ./kdiab-profiles
      dockerfile: Dockerfile.liquibase
    command: >
      --url=jdbc:postgresql://postgres:5432/kdiab-profiles
      --username=${POSTGRES_USER:-postgres}
      --password=${POSTGRES_PASSWORD}
      --search-path=/liquibase
      --changelog-file=db/changelog/db.changelog-master.yaml
      update
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shared
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  liquibase-treatments:
    container_name: kdiab-treatments-liquibase
    image: localhost/kdiab-treatments-liquibase:latest
    build:
      context: ./kdiab-treatments
      dockerfile: Dockerfile.liquibase
    command: >
      --url=jdbc:postgresql://postgres:5432/kdiab-treatments
      --username=${POSTGRES_USER:-postgres}
      --password=${POSTGRES_PASSWORD}
      --search-path=/liquibase
      --changelog-file=db/changelog/db.changelog-root.yaml
      update
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shared
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  liquibase-carbs:
    container_name: kdiab-carbs-liquibase
    image: localhost/kdiab-carbs-liquibase:latest
    build:
      context: ./kdiab-carbs
      dockerfile: Dockerfile.liquibase
    command: >
      --url=jdbc:postgresql://postgres:5432/kdiab-carbs
      --username=${POSTGRES_USER:-postgres}
      --password=${POSTGRES_PASSWORD}
      --search-path=/liquibase
      --changelog-file=db/changelog/db.changelog-root.yaml
      update
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shared
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  liquibase-users:
    container_name: kdiab-users-liquibase
    image: localhost/kdiab-users-liquibase:latest
    build:
      context: ./kdiab-users
      dockerfile: Dockerfile.liquibase
    command: >
      --url=jdbc:postgresql://postgres:5432/kdiab-users
      --username=${POSTGRES_USER:-postgres}
      --password=${POSTGRES_PASSWORD}
      --search-path=/liquibase
      --changelog-file=db/changelog/db.changelog-root.yaml
      update
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shared
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  carbs-backend:
    container_name: kdiab-carbs-backend
    image: localhost/kdiab-carbs-backend:latest
    build:
      context: ./kdiab-carbs
      dockerfile: Dockerfile
    environment:
      JDBC_URL: jdbc:postgresql://postgres:5432/kdiab-carbs
      DB_USER: kdiab_carbs
      DB_PASSWORD: ${CARBS_DB_PASSWORD}
      JWT_DOMAIN: http://localhost:8081/realms/kdiab
      JWKS_URL: http://keycloak:8080/realms/kdiab/protocol/openid-connect/certs
      JWT_AUDIENCE: carbs
      JWT_REALM: kdiab
      CORS_ALLOWED_ORIGINS: http://localhost:3005
      OTEL_SERVICE_NAME: kdiab-carbs
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-none}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-none}
      OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-none}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4317}
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      pg-seed:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
    networks:
      shared:
      kdiab-ui-net:
        aliases:
          - carbs-backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'

  # Runs after all Liquibase migrations to insert seed data
  pg-seed:
    container_name: kdiab-pg-seed
    image: docker.io/library/postgres:15.18@sha256:aba1c9eb4194ee600e1bd492aa7ad37b51d544eaeaeb2e2dee3a65a333cd174e
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./config/postgres/02-seed-data.sql:/seed.sql:ro
    command: >
      psql -h postgres -U ${POSTGRES_USER:-postgres} -f /seed.sql
    depends_on:
      liquibase-measures:
        condition: service_completed_successfully
      liquibase-profiles:
        condition: service_completed_successfully
      liquibase-treatments:
        condition: service_completed_successfully
      liquibase-carbs:
        condition: service_completed_successfully
      liquibase-users:
        condition: service_completed_successfully
    networks:
      - shared
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  # ── kdiab-measures ──────────────────────────────────────────────────────────

  measures-backend:
    container_name: kdiab-measures-backend
    image: localhost/kdiab-measures-backend:latest
    build:
      context: ./kdiab-measures
      dockerfile: Dockerfile
    environment:
