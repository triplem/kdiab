    build:
      context: ./kdiab-analyze
      dockerfile: Dockerfile
    environment:
      MEASURES_URL: http://measures-backend:8080
      PROFILES_URL: http://profiles-backend:8080
      TREATMENTS_URL: http://treatments-backend:8080
      JWT_DOMAIN: http://localhost:8081/realms/kdiab
      JWKS_URL: http://keycloak:8080/realms/kdiab/protocol/openid-connect/certs
      JWT_AUDIENCE: analyze
      JWT_REALM: kdiab
      CORS_ALLOWED_ORIGINS: http://localhost:3005
