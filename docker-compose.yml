      JWKS_URL: http://keycloak:8080/realms/kdiab/protocol/openid-connect/certs
      JWT_AUDIENCE: measure
      JWT_REALM: kdiab
      CORS_ALLOWED_ORIGINS: http://localhost:3005
      OTEL_SERVICE_NAME: kdiab-measures
