  users-backend:
    container_name: kdiab-users-backend
    image: localhost/kdiab-users-backend:latest
    build:
      context: ./kdiab-users
      dockerfile: Dockerfile
    environment:
      PORT: 8088
      JWT_DOMAIN: http://localhost:8081/realms/kdiab
      JWKS_URL: http://keycloak:8080/realms/kdiab/protocol/openid-connect/certs
      JWT_AUDIENCE: users
      JWT_REALM: kdiab
      CORS_ALLOWED_ORIGINS: http://localhost:3005
      JDBC_URL: jdbc:postgresql://postgres:5432/kdiab-users
      DB_USER: kdiab_users
      DB_PASSWORD: ${USERS_DB_PASSWORD}
      OTEL_SERVICE_NAME: kdiab-users
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-none}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-none}
      OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-none}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4317}
      KEYCLOAK_ADMIN_URL: http://keycloak:8080
      KEYCLOAK_REALM: kdiab
      KEYCLOAK_ADMIN_CLIENT_ID: kdiab-users-service
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_USERS_CLIENT_SECRET:-users-service-secret}
      KEYCLOAK_TOKEN_ENDPOINT: http://keycloak:8080/realms/kdiab/protocol/openid-connect/token
      SELF_REGISTRATION_ENABLED: false
      SELF_REGISTRATION_REQUIRES_APPROVAL: false
    ports:
      - "8088:8088"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8088/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      pg-seed:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
    networks:
      shared:
      kdiab-ui-net:
        aliases:
          - users-backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
