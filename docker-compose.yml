  kdiab-ui:
    container_name: kdiab-ui
    image: localhost/kdiab-ui:latest
    build:
      context: ./kdiab-ui
      dockerfile: Dockerfile
      args:
        VITE_OIDC_AUTHORITY: http://localhost:8081/realms/kdiab
        VITE_OIDC_CLIENT_ID: kdiab-ui
    environment:
      KEYCLOAK_URL: http://localhost:8081
    ports:
      - "3005:8080"
    depends_on:
      measures-backend:
        condition: service_healthy
      profiles-backend:
        condition: service_healthy
      treatments-backend:
        condition: service_healthy
      analyze-backend:
        condition: service_healthy
    networks:
      - kdiab-ui-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'
        reservations:
          memory: 32M
          cpus: '0.1'

  # ── Gateway ─────────────────────────────────────────────────────────────────
  # Unified reverse proxy: localhost:3000/{measures,profiles,treatments,analyze}/
  # Routes requests to the appropriate frontend by stripping the service path prefix.
  # Each frontend is built with VITE_BASE_PATH matching its location block so
  # asset references and API calls are prefixed correctly.

networks:
  shared:    # postgres, keycloak, all backends, liquibase, seed
  kdiab-ui-net:  # kdiab-ui ↔ all four backends

volumes:
  postgres_data:
