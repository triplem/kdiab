      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      liquibase-measures:
        condition: service_completed_successfully
      pg-seed:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
    networks:
      shared:
      kdiab-ui-net:
