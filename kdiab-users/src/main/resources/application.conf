ktor {
    deployment {
        port = 8088
        port = ${?PORT}
    }
    application {
        modules = [ org.javafreedom.kdiab.users.ApplicationKt.module ]
    }
}

jwt {
    domain = "http://localhost:8081/realms/kdiab"
    domain = ${?JWT_DOMAIN}
    jwksUrl = "http://localhost:8081/realms/kdiab/protocol/openid-connect/certs"
    jwksUrl = ${?JWKS_URL}
    audience = "users"
    audience = ${?JWT_AUDIENCE}
    realm = "kdiab"
    realm = ${?JWT_REALM}
    secret = ${?JWT_SECRET}
}

cors {
    allowedOrigins = "http://localhost:3000"
    allowedOrigins = ${?CORS_ALLOWED_ORIGINS}
}

storage {
    driverClassName = "org.postgresql.Driver"
    jdbcUrl = "jdbc:postgresql://localhost:5432/kdiab-users"
    jdbcUrl = ${?JDBC_URL}
    username = "kdiab"
    username = ${?DB_USER}
    password = ${DB_PASSWORD}
    maximumPoolSize = 10
    maximumPoolSize = ${?DB_POOL_SIZE}
    isAutoCommit = false
    transactionIsolation = "TRANSACTION_REPEATABLE_READ"
}

keycloakAdmin {
    url = "http://localhost:8081"
    url = ${?KEYCLOAK_ADMIN_URL}
    realm = "kdiab"
    realm = ${?KEYCLOAK_REALM}
    clientId = "kdiab-users-service"
    clientId = ${?KEYCLOAK_ADMIN_CLIENT_ID}
    clientSecret = ${KEYCLOAK_ADMIN_CLIENT_SECRET}
    tokenEndpoint = "http://localhost:8081/realms/kdiab/protocol/openid-connect/token"
    tokenEndpoint = ${?KEYCLOAK_TOKEN_ENDPOINT}
}

app {
    initDatabase = true
    initDatabase = ${?APP_INIT_DATABASE}
    invitationExpiryIntervalMinutes = 60
    invitationExpiryIntervalMinutes = ${?INVITATION_EXPIRY_INTERVAL_MINUTES}
}

logging {
    suppressHealthChecks = true
    suppressHealthChecks = ${?LOGGING_SUPPRESS_HEALTH_CHECKS}
}

json {
    prettyPrint = false
    prettyPrint = ${?JSON_PRETTY_PRINT}
}
