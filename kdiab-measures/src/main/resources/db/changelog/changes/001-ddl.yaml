databaseChangeLog:
  - logicalFilePath: db/changelog/db.changelog-root.yaml
  - changeSet:
      id: 001
      author: javafreedom
      changes:
        - createTable:
            tableName: measures
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: measured_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: source
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: data
                  type: jsonb
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(50)
                  defaultValue: 'ACTIVE'
                  constraints:
                    nullable: false
  - changeSet:
      id: 002
      author: javafreedom
      changes:
        - createIndex:
            indexName: idx_measures_user_id
            tableName: measures
            columns:
              - column:
                  name: user_id
        - createIndex:
            indexName: idx_measures_user_type
            tableName: measures
            columns:
              - column:
                  name: user_id
              - column:
                  name: type
        - createIndex:
            indexName: idx_measures_measured_at
            tableName: measures
            columns:
              - column:
                  name: measured_at
  - changeSet:
      id: 003
      author: javafreedom
      dbms: postgresql
      changes:
        - createIndex:
            indexName: idx_measures_user_time
            tableName: measures
            columns:
              - column:
                  name: user_id
              - column:
                  name: measured_at
                  descending: true
  - changeSet:
      id: 004
      author: javafreedom
      changes:
        - createTable:
            tableName: audit_logs
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: doctor_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: patient_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: action
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: occurred_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: ip_address
                  type: varchar(100)
              - column:
                  name: user_agent
                  type: text
        - createIndex:
            indexName: idx_audit_logs_patient_id
            tableName: audit_logs
            columns:
              - column:
                  name: patient_id
        - createIndex:
            indexName: idx_audit_logs_occurred_at
            tableName: audit_logs
            columns:
              - column:
                  name: occurred_at
  - changeSet:
      id: 005
      author: javafreedom
      changes:
        - addColumn:
            tableName: audit_logs
            columns:
              - column:
                  name: detail
                  type: TEXT
                  constraints:
                    nullable: true
