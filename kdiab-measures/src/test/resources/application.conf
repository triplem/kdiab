ktor {
    deployment {
        port = 8080
    }
    application {
        modules = [ org.javafreedom.kdiab.measures.ApplicationKt.module ]
    }
}

jwt {
    domain = "http://localhost:8081/realms/kdiab-measures"
    audience = "measure"
    realm = "kdiab-measures"
    test = true
    allowTestMode = true
    secret = "test-secret-for-unit-tests-only"
}

storage {
    driverClassName = "org.h2.Driver"
    jdbcUrl = "jdbc:h2:mem:test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL"
    username = "sa"
    password = ""
    maximumPoolSize = 3
    isAutoCommit = false
    transactionIsolation = "TRANSACTION_REPEATABLE_READ"
}
