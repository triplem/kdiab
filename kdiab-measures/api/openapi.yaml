openapi: "3.1.0"
info:
  title: kdiab-measures API
  version: 0.1.0
  description: API for managing Type 1 Diabetes health measurements

servers:
  - url: http://localhost:8080/api/v1

security:
  - bearerAuth: []

tags:
  - name: Measures
    description: Health measurement management

paths:
  /users/{userId}/measures:
    get:
      summary: List active measures for a user (paginated)
      description: Returns a paginated list of health measurements for the given user, filtered by status (default ACTIVE).
      operationId: listMeasures
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
        - name: from
          in: query
          required: false
          description: Filter measures on or after this timestamp (ISO-8601)
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Filter measures on or before this timestamp (ISO-8601)
          schema:
            type: string
            format: date-time
        - name: status
          in: query
          required: false
          description: Filter by measure status (default ACTIVE)
          schema:
            type: string
            enum: [ACTIVE, ARCHIVED]
            default: ACTIVE
      responses:
        '200':
          description: Paginated list of active measures
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedMeasureResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      summary: Create a new measure
      description: Records a new health measurement for the user with ACTIVE status.
      operationId: createMeasure
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMeasureRequest'
      responses:
        '201':
          description: Measure created successfully
          headers:
            Location:
              schema:
                type: string
              description: URL of the created resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeasureResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      summary: Permanently delete measures
      description: Only doctors and admins can permanently delete measures.
      operationId: deleteMeasures
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkMeasureRequest'
      responses:
        '200':
          description: Measures deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /users/{userId}/measures/{measureId}:
    put:
      summary: Update a measure
      description: Updates the timestamp and data payload of an existing measure. The measure type cannot be changed.
      operationId: updateMeasure
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: measureId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeasureRequest'
      responses:
        '200':
          description: Measure updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeasureResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{userId}/measures/archive:
    post:
      summary: Archive multiple measures
      description: Patients can archive their own measures. Doctors can archive for their allowed patients.
      operationId: archiveMeasures
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkMeasureRequest'
      responses:
        '200':
          description: Measures archived successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /users/{userId}/measures/unarchive:
    post:
      summary: Unarchive measures
      description: Restore archived measures to ACTIVE status.
      operationId: unarchiveMeasures
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkMeasureRequest'
      responses:
        '200':
          description: Measures unarchived successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Too Many Requests
      headers:
        X-RateLimit-Limit:
          schema:
            type: integer
          description: Maximum requests per window
        X-RateLimit-Remaining:
          schema:
            type: integer
          description: Remaining requests in current window
        Retry-After:
          schema:
            type: integer
          description: Seconds until the rate limit resets
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RateLimitErrorResponse'

  schemas:
    PagedMeasureResponse:
      type: object
      required:
        - items
        - page
        - size
        - totalCount
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MeasureResponse'
        page:
          type: integer
        size:
          type: integer
        totalCount:
          type: integer
          format: int64

    MeasureResponse:
      type: object
      required:
        - id
        - userId
        - measuredAt
        - createdAt
        - type
        - source
        - data
        - status
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        measuredAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        type:
          $ref: '#/components/schemas/MeasureType'
        source:
          $ref: '#/components/schemas/MeasureSource'
        data:
          $ref: '#/components/schemas/MeasurePayload'
        status:
          $ref: '#/components/schemas/MeasureStatus'

    CreateMeasureRequest:
      type: object
      required:
        - measuredAt
        - type
        - source
        - data
      properties:
        measuredAt:
          type: string
          format: date-time
        type:
          $ref: '#/components/schemas/MeasureType'
        source:
          $ref: '#/components/schemas/MeasureSource'
        data:
          $ref: '#/components/schemas/MeasurePayload'

    UpdateMeasureRequest:
      type: object
      required:
        - measuredAt
        - data
      properties:
        measuredAt:
          type: string
          format: date-time
        data:
          $ref: '#/components/schemas/MeasurePayload'

    BulkMeasureRequest:
      type: object
      required:
        - measureIds
      properties:
        measureIds:
          type: array
          items:
            type: string
            format: uuid

    MeasurePayload:
      description: JSON payload whose structure depends on the measure type. Use the sibling `type` field as the discriminator.
      oneOf:
        - $ref: '#/components/schemas/CgmData'
        - $ref: '#/components/schemas/BgmData'
        - $ref: '#/components/schemas/BloodPressureData'
        - $ref: '#/components/schemas/WeightData'
        - $ref: '#/components/schemas/PulseData'
        - $ref: '#/components/schemas/BgCheckData'
        - $ref: '#/components/schemas/KetoneCheckData'
        - $ref: '#/components/schemas/GlycosylatedHemoglobinData'

    CgmData:
      type: object
      description: Continuous Glucose Monitor reading
      required: [value]
      properties:
        value:
          type: number
          format: double
          description: Glucose reading in mg/dL
          example: 120
        trend:
          type: string
          description: CGM directional trend arrow
          enum: [DoubleUp, SingleUp, FortyFiveUp, Flat, FortyFiveDown, SingleDown, DoubleDown, None]
          example: Flat

    BgmData:
      type: object
      description: Blood Glucose Meter reading
      required: [value]
      properties:
        value:
          type: number
          format: double
          description: Blood glucose in mg/dL
          example: 110

    BloodPressureData:
      type: object
      description: Blood pressure measurement
      required: [systolic, diastolic]
      properties:
        systolic:
          type: number
          format: double
          description: Systolic pressure in mmHg
          example: 120
        diastolic:
          type: number
          format: double
          description: Diastolic pressure in mmHg
          example: 80

    WeightData:
      type: object
      description: Body weight measurement
      required: [value]
      properties:
        value:
          type: number
          format: double
          description: Weight value
          example: 75.5
        unit:
          type: string
          description: Weight unit
          enum: [kg, lbs]
          example: kg

    PulseData:
      type: object
      description: Heart rate measurement
      required: [value]
      properties:
        value:
          type: number
          format: double
          description: Heart rate in beats per minute
          example: 72

    BgCheckData:
      type: object
      description: Manual blood glucose check
      required: [value]
      properties:
        value:
          type: number
          format: double
          description: Blood glucose in mg/dL
          example: 100

    KetoneCheckData:
      type: object
      description: Blood or urine ketone measurement
      required: [value]
      properties:
        value:
          type: number
          format: double
          description: Ketone level in mmol/L
          example: 1.5
        method:
          type: string
          description: Measurement method
          enum: [blood, urine]
          example: blood

    GlycosylatedHemoglobinData:
      type: object
      description: HbA1c (glycated haemoglobin) lab result (GLYCOSYLATED_HEMOGLOBIN)
      required: [value]
      properties:
        value:
          type: number
          format: double
          description: HbA1c value in percent
          example: 7.2
        unit:
          type: string
          description: Unit of measurement (always %)
          enum: ["%"]
          example: "%"

    MeasureType:
      type: string
      description: |
        The type of health measurement, which defines the expected structure of the data payload:
        - CGM: Continuous Glucose Monitor reading in mg/dL (e.g. `{"value": 120, "trend": "Flat"}`)
        - BGM: Blood Glucose Meter reading in mg/dL (e.g. `{"value": 110}`)
        - BLOOD_PRESSURE: (e.g. `{"systolic": 120, "diastolic": 80}`) — two values, both in mmHg
        - WEIGHT: (e.g. `{"value": 75.5, "unit": "kg"}`)
        - PULSE: Heart rate in bpm (e.g. `{"value": 72}`)
        - BG_CHECK: Manual blood glucose check, stored in mg/dL (e.g. `{"value": 100}`)
        - KETONE_CHECK: Blood or urine ketone measurement in mmol/L (e.g. `{"value": 1.5, "method": "blood"}`). `method` is `blood` or `urine`.
        - GLYCOSYLATED_HEMOGLOBIN: HbA1c value in percent (e.g. `{"value": 7.2, "unit": "%"}`). Replaces the former dedicated HbA1c endpoint.
      enum:
        - CGM
        - BGM
        - BLOOD_PRESSURE
        - WEIGHT
        - PULSE
        - BG_CHECK
        - KETONE_CHECK
        - GLYCOSYLATED_HEMOGLOBIN

    MeasureSource:
      type: string
      description: The origin of the measurement data
      enum:
        - MANUAL
        - NIGHTSCOUT
        - GOOGLE_FIT
        - APPLE_HEALTH
        - LAB
        - ESTIMATED

    MeasureStatus:
      type: string
      enum:
        - ACTIVE
        - ARCHIVED

    ErrorResponse:
      type: object
      description: Standard error envelope returned by all error responses
      required:
        - code
        - message
      properties:
        code:
          type: integer
          description: HTTP status code
        message:
          type: string
          description: Human-readable error description

    RateLimitErrorResponse:
      type: object
      description: Error envelope returned when the rate limit is exceeded
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Error code identifier
          example: RATE_LIMIT_EXCEEDED
        message:
          type: string
          description: Human-readable error description
          example: Too many requests
