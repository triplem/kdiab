databaseChangeLog:
  - changeSet:
      id: 001
      author: javafreedom
      changes:
        - createTable:
            tableName: measures
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: measured_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: source
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: data
                  type: jsonb
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(50)
                  defaultValue: 'ACTIVE'
                  constraints:
                    nullable: false
  - changeSet:
      id: 002
      author: javafreedom
      changes:
        - createIndex:
            indexName: idx_measures_user_id
            tableName: measures
            columns:
              - column:
                  name: user_id
        - createIndex:
            indexName: idx_measures_user_type
            tableName: measures
            columns:
              - column:
                  name: user_id
              - column:
                  name: type
        - createIndex:
            indexName: idx_measures_measured_at
            tableName: measures
            columns:
              - column:
                  name: measured_at
