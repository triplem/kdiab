services:
  postgres:
    image: postgres:15.18@sha256:eb37f58646a901dc7727cf448cae36daaefaba79de33b5058dab79aa4c04aefb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-kdiab-measures}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-kdiab-measures}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.1@sha256:dea26401d06341095cc4ea9d66896200b55de5ca1daa1d2fcbe58493afa6e0ad
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes:
      - ./config/keycloak-realm.json:/opt/keycloak/data/import/realm.json
      - ./config/keycloak-theme:/opt/keycloak/themes/kdiab
    ports:
      - "8081:8080"
    restart: unless-stopped

  liquibase:
    build:
      context: .
      dockerfile: Dockerfile.liquibase
    command: >
      --url=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-kdiab-measures}
      --username=${POSTGRES_USER:-postgres}
      --password=${POSTGRES_PASSWORD:-password}
      --searchPath=/liquibase
      --changeLogFile=db/changelog/db.changelog-master.yaml
      update
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-kdiab-measures}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-password}
      JWT_DOMAIN: http://localhost:8081/realms/kdiab-measures
      JWKS_URL: http://keycloak:8080/realms/kdiab-measures/protocol/openid-connect/certs
      JWT_AUDIENCE: measure
      JWT_REALM: kdiab-measures
      JSON_PRETTY_PRINT: "true"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      liquibase:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
