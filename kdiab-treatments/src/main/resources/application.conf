ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ org.javafreedom.kdiab.treatments.ApplicationKt.module ]
    }
}

jwt {
    domain = "http://localhost:8081/realms/kdiab-treatments"
    domain = ${?JWT_DOMAIN}
    jwksUrl = "http://localhost:8081/realms/kdiab-treatments/protocol/openid-connect/certs"
    jwksUrl = ${?JWKS_URL}
    audience = "treatment"
    audience = ${?JWT_AUDIENCE}
    realm = "kdiab-treatments"
    realm = ${?JWT_REALM}
    secret = ${?JWT_SECRET}
}

cors {
    allowedOrigins = "http://localhost:3000"
    allowedOrigins = ${?CORS_ALLOWED_ORIGINS}
}

swagger {
    enabled = false
    enabled = ${?SWAGGER_ENABLED}
}

storage {
    driverClassName = "org.postgresql.Driver"
    jdbcUrl = ${?JDBC_URL}
    # No default — must be supplied via DB_USER and DB_PASSWORD.
    username = ${?DB_USER}
    password = ${?DB_PASSWORD}
    maximumPoolSize = 10
    maximumPoolSize = ${?DB_POOL_SIZE}
    isAutoCommit = false
    transactionIsolation = "TRANSACTION_REPEATABLE_READ"
}

db {
    # Liquibase migrations are managed by a dedicated Docker container in production.
    # Set to true only in test environments (H2 in-memory DB has no external migrator).
    runMigrations = false
    runMigrations = ${?DB_RUN_MIGRATIONS}
}

logging {
    suppressHealthChecks = true
    suppressHealthChecks = ${?LOGGING_SUPPRESS_HEALTH_CHECKS}
}

json {
    prettyPrint = false
    prettyPrint = ${?JSON_PRETTY_PRINT}
}
