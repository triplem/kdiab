openapi: "3.1.0"
info:
  title: kdiab-treatments API
  version: 0.0.1
  description: |
    API for managing Type 1 Diabetes treatment records.
    Treatments cover all clinically relevant events including insulin boluses,
    carbohydrate intake, basal insulin, and other Nightscout-compatible treatment types.

servers:
  - url: http://localhost:8080/api/v1

security:
  - bearerAuth: []

tags:
  - name: Treatments
    description: Treatment event management
  - name: DeviceStatus
    description: APS pump and uploader device status telemetry

paths:
  /users/{userId}/treatments:
    get:
      summary: List all treatments for a user
      description: Returns a paginated list of treatment events for the given user, optionally filtered by type, status, and date range.
      operationId: listTreatments
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: type
          in: query
          required: false
          description: Filter by treatment type
          schema:
            $ref: '#/components/schemas/TreatmentType'
        - name: from
          in: query
          required: false
          description: Filter treatments on or after this timestamp (ISO-8601)
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Filter treatments on or before this timestamp (ISO-8601)
          schema:
            type: string
            format: date-time
        - name: status
          in: query
          required: false
          description: Filter by treatment status (default ACTIVE)
          schema:
            type: string
            enum:
              - ACTIVE
              - ARCHIVED
            default: ACTIVE
        - name: page
          in: query
          required: false
          description: Zero-based page number (default 0)
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: Page size (default 50, max 200)
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Paginated list of treatments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedTreatmentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      summary: Create a new treatment record
      description: Records a new treatment event (bolus, carbs, basal, etc.) for the given user with ACTIVE status.
      operationId: createTreatment
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTreatmentRequest'
      responses:
        '201':
          description: Treatment created successfully
          headers:
            Location:
              schema:
                type: string
              description: URL of the created resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TreatmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /users/{userId}/treatments/{treatmentId}:
    put:
      summary: Update a treatment
      description: Updates the timestamp, data payload, and optional notes of an existing treatment record. The treatment type cannot be changed.
      operationId: updateTreatment
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: treatmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTreatmentRequest'
      responses:
        '200':
          description: Treatment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TreatmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{userId}/treatments/archive:
    post:
      summary: Archive treatments (soft-delete)
      description: Mark treatments as ARCHIVED. Available to all authorized users (patients for their own, doctors for assigned patients, admins for all).
      operationId: archiveTreatments
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkTreatmentRequest'
      responses:
        '200':
          description: Treatments archived successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /users/{userId}/treatments/unarchive:
    post:
      summary: Unarchive treatments
      description: Restore archived treatments to ACTIVE status.
      operationId: unarchiveTreatments
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkTreatmentRequest'
      responses:
        '200':
          description: Treatments unarchived successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /users/{userId}/device-status/latest:
    get:
      summary: Get the latest device status for a user
      description: Returns the most recently recorded pump and uploader device status snapshot for the given user. Returns 404 if no status has been recorded yet.
      operationId: getLatestDeviceStatus
      tags:
        - DeviceStatus
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Latest device status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{userId}/device-age:
    get:
      summary: Get device age timestamps for a user
      description: Returns the most recent timestamp for each device-related treatment type (catheter/cannula change, insulin reservoir change, CGM sensor insertion). Null if a treatment of that type has never been recorded.
      operationId: getDeviceAge
      tags:
        - Treatments
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Device age timestamps
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceAgeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /users/{userId}/treatments/delete:
    post:
      summary: Permanently delete treatments
      description: Patients can delete their own treatments. Doctors can delete for their assigned patients. Admins can delete for all users.
      operationId: deleteTreatments
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkTreatmentRequest'
      responses:
        '200':
          description: Treatments deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Too Many Requests
      headers:
        X-RateLimit-Limit:
          schema:
            type: integer
          description: Maximum requests per window
        X-RateLimit-Remaining:
          schema:
            type: integer
          description: Remaining requests in current window
        Retry-After:
          schema:
            type: integer
          description: Seconds until the rate limit resets
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RateLimitErrorResponse'

  schemas:
    PagedTreatmentResponse:
      type: object
      required:
        - items
        - page
        - size
        - totalCount
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TreatmentResponse'
        page:
          type: integer
          description: Zero-based current page number
        size:
          type: integer
          description: Number of items per page
        totalCount:
          type: integer
          format: int64
          description: Total number of matching treatments

    TreatmentResponse:
      type: object
      required:
        - id
        - userId
        - treatedAt
        - createdAt
        - type
        - data
        - status
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        treatedAt:
          type: string
          format: date-time
          description: When the treatment actually occurred
        createdAt:
          type: string
          format: date-time
          description: When the record was entered into the system
        type:
          $ref: '#/components/schemas/TreatmentType'
        data:
          $ref: '#/components/schemas/TreatmentPayload'
        notes:
          type: string
          description: Optional free-text notes
        status:
          type: string
          description: Treatment status (ACTIVE or ARCHIVED)
          enum:
            - ACTIVE
            - ARCHIVED

    CreateTreatmentRequest:
      type: object
      required:
        - treatedAt
        - type
        - data
      properties:
        treatedAt:
          type: string
          format: date-time
          description: When the treatment actually occurred
        type:
          $ref: '#/components/schemas/TreatmentType'
        data:
          $ref: '#/components/schemas/TreatmentPayload'
        notes:
          type: string
          description: Optional free-text notes

    UpdateTreatmentRequest:
      type: object
      required:
        - treatedAt
        - data
      properties:
        treatedAt:
          type: string
          format: date-time
          description: When the treatment actually occurred
        data:
          $ref: '#/components/schemas/TreatmentPayload'
        notes:
          type: string
          description: Optional free-text notes

    BulkTreatmentRequest:
      type: object
      required:
        - treatmentIds
      properties:
        treatmentIds:
          type: array
          items:
            type: string
            format: uuid

    TreatmentPayload:
      description: JSON payload whose structure depends on the treatment type. Use the sibling `type` field as the discriminator. All `duration` fields are in minutes.
      oneOf:
        - $ref: '#/components/schemas/BolusData'
        - $ref: '#/components/schemas/BasalData'
        - $ref: '#/components/schemas/CarbsData'
        - $ref: '#/components/schemas/CorrectionBolusData'
        - $ref: '#/components/schemas/ComboBolusData'
        - $ref: '#/components/schemas/TempBasalData'
        - $ref: '#/components/schemas/ExerciseData'
        - $ref: '#/components/schemas/NoteData'
        - $ref: '#/components/schemas/PumpSuspendData'
        - $ref: '#/components/schemas/SiteChangeData'
        - $ref: '#/components/schemas/SensorInsertData'
        - $ref: '#/components/schemas/InsulinChangeData'
        - $ref: '#/components/schemas/PumpBatteryChangeData'
        - $ref: '#/components/schemas/ActivityData'
        - $ref: '#/components/schemas/HypoTreatmentData'
        - $ref: '#/components/schemas/DeviceStatusData'

    BolusData:
      type: object
      description: Rapid-acting insulin dose (BOLUS)
      required: [insulin]
      properties:
        insulin:
          type: number
          format: double
          description: Insulin dose in units
          example: 2.5
        insulinType:
          type: string
          description: Brand/type of insulin used
          example: NovoRapid

    BasalData:
      type: object
      description: Long-acting basal insulin dose (BASAL)
      required: [insulin]
      properties:
        insulin:
          type: number
          format: double
          description: Insulin dose in units
          example: 10.0
        insulinType:
          type: string
          description: Brand/type of insulin used
          example: Lantus
        duration:
          type: number
          format: double
          description: Duration in minutes
          example: 1440

    CarbsData:
      type: object
      description: Carbohydrate intake only (CARBS)
      required: [carbs]
      properties:
        carbs:
          type: number
          format: double
          description: Carbohydrate amount in grams
          example: 45
        absorptionTime:
          type: number
          format: double
          description: Estimated absorption time in hours
          example: 3

    CorrectionBolusData:
      type: object
      description: Correction insulin dose (CORRECTION_BOLUS)
      required: [insulin]
      properties:
        insulin:
          type: number
          format: double
          description: Insulin dose in units
          example: 1.0

    ComboBolusData:
      type: object
      description: Split bolus — part immediate, part extended (COMBO_BOLUS)
      required: [insulin, splitNow, splitExt, duration]
      properties:
        insulin:
          type: number
          format: double
          description: Total insulin dose in units
          example: 3.0
        splitNow:
          type: number
          format: double
          description: Percentage delivered immediately
          example: 50
        splitExt:
          type: number
          format: double
          description: Percentage delivered over the extended period
          example: 50
        duration:
          type: number
          format: double
          description: Extended delivery duration in minutes
          example: 120

    TempBasalData:
      type: object
      description: Temporary basal rate change (TEMP_BASAL)
      required: [rate, duration]
      properties:
        rate:
          type: number
          format: double
          description: Basal rate in U/hr
          example: 0.5
        duration:
          type: number
          format: double
          description: Duration in minutes
          example: 30
        absolute:
          type: boolean
          description: True = absolute rate, false = percentage of scheduled rate
          example: true

    ExerciseData:
      type: object
      description: Physical activity event (EXERCISE)
      required: [duration]
      properties:
        duration:
          type: number
          format: double
          description: Duration in minutes
          example: 60
        intensity:
          type: string
          description: Exercise intensity level
          enum: [low, moderate, high]
          example: moderate

    NoteData:
      type: object
      description: Free-text note (NOTE)
      required: [text]
      properties:
        text:
          type: string
          description: Note content
          example: felt low before dinner

    PumpSuspendData:
      type: object
      description: Insulin pump suspended (PUMP_SUSPEND)
      required: [duration]
      properties:
        duration:
          type: number
          format: double
          description: Suspension duration in minutes
          example: 30
        reason:
          type: string
          description: Reason for suspension
          example: exercise

    SiteChangeData:
      type: object
      description: Infusion site/cannula replacement (SITE_CHANGE)
      properties:
        location:
          type: string
          description: Insertion site location
          example: left abdomen

    SensorInsertData:
      type: object
      description: CGM sensor insertion (SENSOR_INSERT)
      properties:
        sensor:
          type: string
          description: CGM sensor model/brand
          example: Dexcom G7

    InsulinChangeData:
      type: object
      description: Insulin cartridge or pen replacement (INSULIN_CHANGE)
      properties:
        insulinType:
          type: string
          description: New insulin type loaded
          example: NovoRapid

    PumpBatteryChangeData:
      type: object
      description: Pump battery replacement (PUMP_BATTERY_CHANGE)
      properties:
        batteryType:
          type: string
          description: Battery model or type installed
          example: AA

    ActivityData:
      type: object
      description: Named physical activity with intensity (ACTIVITY)
      required: [name, duration]
      properties:
        name:
          type: string
          description: Activity name
          example: running
        duration:
          type: number
          format: double
          description: Duration in minutes
          example: 45
        intensity:
          type: string
          description: Activity intensity level
          enum: [low, moderate, high]
          example: moderate

    HypoTreatmentData:
      type: object
      description: Emergency fast-acting carbohydrate intake for hypoglycaemia (HYPO_TREATMENT)
      required: [carbs]
      properties:
        carbs:
          type: number
          format: double
          description: Fast-acting carbohydrate amount in grams
          example: 15
        reason:
          type: string
          description: Context for the hypo treatment
          example: glucose below 70

    DeviceStatusData:
      type: object
      description: Pump and uploader device status snapshot (DEVICE_STATUS). Sent periodically by APS clients (AAPS, xDrip+, Juggluco) to report pump reservoir, battery, and client identity.
      required: [device]
      properties:
        device:
          type: string
          description: Name and version of the uploading client application
          example: "AAPS 3.2.0"
        pumpName:
          type: string
          description: Pump model identifier as reported by the client
          example: "Dana RS"
        reservoirUnits:
          type: number
          format: double
          description: Insulin units remaining in the pump reservoir
          example: 142.5
        batteryLevel:
          type: integer
          format: int32
          description: Pump battery level as a percentage (0–100)
          minimum: 0
          maximum: 100
          example: 87
        pumpConnected:
          type: boolean
          description: Whether the pump was connected at the time of the status report
          example: true

    DeviceAgeResponse:
      type: object
      description: Most recent timestamp for each device-related treatment type. Null if that treatment type has never been recorded for the user.
      properties:
        catheterChangedAt:
          type: ["string", "null"]
          format: date-time
          description: When the infusion site/cannula was last replaced (SITE_CHANGE)
          example: "2026-05-14T10:30:00Z"
        reservoirChangedAt:
          type: ["string", "null"]
          format: date-time
          description: When the insulin cartridge was last replaced (INSULIN_CHANGE)
          example: "2026-05-13T08:00:00Z"
        sensorInsertedAt:
          type: ["string", "null"]
          format: date-time
          description: When the CGM sensor was last inserted (SENSOR_INSERT)
          example: "2026-05-12T18:00:00Z"
        batteryChangedAt:
          type: ["string", "null"]
          format: date-time
          description: When the pump battery was last replaced (PUMP_BATTERY_CHANGE)
          example: "2026-05-10T14:00:00Z"

    DeviceStatusResponse:
      type: object
      description: Most recent pump and uploader device status snapshot for a user
      required:
        - id
        - userId
        - recordedAt
        - device
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the device status record
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        userId:
          type: string
          format: uuid
          description: User the status belongs to
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        recordedAt:
          type: string
          format: date-time
          description: When the status was recorded by the APS client
          example: "2026-05-16T10:00:00Z"
        device:
          type: string
          description: Name and version of the uploading client application
          example: "AAPS 3.2.0"
        pumpName:
          type: string
          description: Pump model identifier as reported by the client
          example: "Dana RS"
        reservoirUnits:
          type: number
          format: double
          description: Insulin units remaining in the pump reservoir
          example: 142.5
        batteryLevel:
          type: integer
          format: int32
          description: Pump battery level as a percentage (0–100)
          minimum: 0
          maximum: 100
          example: 87
        pumpConnected:
          type: boolean
          description: Whether the pump was connected at the time of the status report
          example: true

    TreatmentType:
      type: string
      description: |
        The type of treatment, which defines the expected structure of the data payload.
        Mapped to Nightscout eventType values where applicable:
        - BOLUS: Rapid-acting insulin dose ("Meal Bolus" / "Bolus")
        - BASAL: Long-acting basal insulin ("Basal")
        - CARBS: Carbohydrate intake only ("Carbs Only")
        - CORRECTION_BOLUS: Correction insulin dose ("Correction Bolus")
        - COMBO_BOLUS: Split bolus — part immediate, part extended ("Combo Bolus")
        - TEMP_BASAL: Temporary basal rate change ("Temp Basal")
        - EXERCISE: Physical activity ("Exercise")
        - NOTE: Free-text note ("Note")
        - PUMP_SUSPEND: Insulin pump suspended ("Pump Suspend")
        - SITE_CHANGE: Infusion site/cannula replacement ("Site Change")
        - SENSOR_INSERT: CGM sensor insertion ("Sensor Insert")
        - INSULIN_CHANGE: Insulin cartridge/pen replacement ("Insulin Change")
        - ACTIVITY: Physical activity log with name, duration (minutes), and intensity level (low/moderate/high)
        - HYPO_TREATMENT: Emergency fast-acting carbohydrate intake to correct hypoglycaemia (juice, dextrose)
        - DEVICE_STATUS: Pump and uploader status snapshot (reservoir units, battery level, client name)
        - PUMP_BATTERY_CHANGE: Pump battery replacement
      enum:
        - BOLUS
        - BASAL
        - CARBS
        - CORRECTION_BOLUS
        - COMBO_BOLUS
        - TEMP_BASAL
        - EXERCISE
        - NOTE
        - PUMP_SUSPEND
        - SITE_CHANGE
        - SENSOR_INSERT
        - INSULIN_CHANGE
        - ACTIVITY
        - HYPO_TREATMENT
        - DEVICE_STATUS
        - PUMP_BATTERY_CHANGE

    ErrorResponse:
      type: object
      description: Standard error envelope returned by all error responses
      required:
        - code
        - message
      properties:
        code:
          type: integer
          description: HTTP status code
        message:
          type: string
          description: Human-readable error description

    RateLimitErrorResponse:
      type: object
      description: Error envelope returned when the rate limit is exceeded
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Error code identifier
          example: RATE_LIMIT_EXCEEDED
        message:
          type: string
          description: Human-readable error description
          example: Too many requests
