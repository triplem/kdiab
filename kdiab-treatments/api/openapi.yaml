openapi: 3.0.3
info:
  title: kdiab-treatments API
  version: 0.0.1
  description: |
    API for managing Type 1 Diabetes treatment records.
    Treatments cover all clinically relevant events including insulin boluses,
    carbohydrate intake, basal insulin, and other Nightscout-compatible treatment types.

servers:
  - url: http://localhost:8080/api/v1

security:
  - bearerAuth: []

paths:
  /users/{userId}/treatments:
    get:
      summary: List all treatments for a user
      operationId: listTreatments
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: type
          in: query
          required: false
          description: Filter by treatment type
          schema:
            $ref: '#/components/schemas/TreatmentType'
        - name: from
          in: query
          required: false
          description: Filter treatments on or after this timestamp (ISO-8601)
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Filter treatments on or before this timestamp (ISO-8601)
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: List of active treatments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TreatmentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Create a new treatment record
      operationId: createTreatment
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTreatmentRequest'
      responses:
        '201':
          description: Treatment created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TreatmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users/{userId}/treatments/delete:
    post:
      summary: Permanently delete treatments
      description: Patients can delete their own treatments. Doctors can delete for their assigned patients. Admins can delete for all users.
      operationId: deleteTreatments
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkTreatmentRequest'
      responses:
        '200':
          description: Treatments deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    TreatmentResponse:
      type: object
      required:
        - id
        - userId
        - treatedAt
        - createdAt
        - type
        - data
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        treatedAt:
          type: string
          format: date-time
          description: When the treatment actually occurred
        createdAt:
          type: string
          format: date-time
          description: When the record was entered into the system
        type:
          $ref: '#/components/schemas/TreatmentType'
        data:
          $ref: '#/components/schemas/TreatmentPayload'
        notes:
          type: string
          description: Optional free-text notes

    CreateTreatmentRequest:
      type: object
      required:
        - treatedAt
        - type
        - data
      properties:
        treatedAt:
          type: string
          format: date-time
          description: When the treatment actually occurred
        type:
          $ref: '#/components/schemas/TreatmentType'
        data:
          $ref: '#/components/schemas/TreatmentPayload'
        notes:
          type: string
          description: Optional free-text notes

    BulkTreatmentRequest:
      type: object
      required:
        - treatmentIds
      properties:
        treatmentIds:
          type: array
          items:
            type: string
            format: uuid

    TreatmentPayload:
      type: object
      description: |
        Flexible JSON payload whose structure depends on the treatment type.
        Follows Nightscout treatment conventions where applicable.
        All `duration` fields are in **minutes**.
        - BOLUS: `{"insulin": 2.5, "insulinType": "NovoRapid"}`
        - BASAL: `{"insulin": 10.0, "insulinType": "Lantus", "duration": 1440}`
        - CARBS: `{"carbs": 45, "absorptionTime": 3}`
        - CORRECTION_BOLUS: `{"insulin": 1.0}`
        - COMBO_BOLUS: `{"insulin": 3.0, "splitNow": 50, "splitExt": 50, "duration": 120}`
        - TEMP_BASAL: `{"rate": 0.5, "duration": 30, "absolute": true}`
        - EXERCISE: `{"duration": 60, "intensity": "moderate"}`
        - NOTE: `{"text": "felt low before dinner"}`
        - PUMP_SUSPEND: `{"duration": 30, "reason": "exercise"}`
        - SITE_CHANGE: `{"location": "left abdomen"}`
        - SENSOR_INSERT: `{"sensor": "Dexcom G7"}`
        - INSULIN_CHANGE: `{"insulinType": "NovoRapid"}`
        - ACTIVITY: `{"name": "running", "duration": 45, "intensity": "moderate"}`
      additionalProperties: true

    TreatmentType:
      type: string
      description: |
        The type of treatment, which defines the expected structure of the data payload.
        Mapped to Nightscout eventType values where applicable:
        - BOLUS: Rapid-acting insulin dose ("Meal Bolus" / "Bolus")
        - BASAL: Long-acting basal insulin ("Basal")
        - CARBS: Carbohydrate intake only ("Carbs Only")
        - CORRECTION_BOLUS: Correction insulin dose ("Correction Bolus")
        - COMBO_BOLUS: Split bolus — part immediate, part extended ("Combo Bolus")
        - TEMP_BASAL: Temporary basal rate change ("Temp Basal")
        - EXERCISE: Physical activity ("Exercise")
        - NOTE: Free-text note ("Note")
        - PUMP_SUSPEND: Insulin pump suspended ("Pump Suspend")
        - SITE_CHANGE: Infusion site/cannula replacement ("Site Change")
        - SENSOR_INSERT: CGM sensor insertion ("Sensor Insert")
        - INSULIN_CHANGE: Insulin cartridge/pen replacement ("Insulin Change")
        - ACTIVITY: Physical activity log with name, duration (minutes), and intensity level (low/moderate/high)
      enum:
        - BOLUS
        - BASAL
        - CARBS
        - CORRECTION_BOLUS
        - COMBO_BOLUS
        - TEMP_BASAL
        - EXERCISE
        - NOTE
        - PUMP_SUSPEND
        - SITE_CHANGE
        - SENSOR_INSERT
        - INSULIN_CHANGE
        - ACTIVITY

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
        message:
          type: string
