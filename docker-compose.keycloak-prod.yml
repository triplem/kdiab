# =============================================================================
# Keycloak production-mode overlay
#
# Overrides the keycloak service in docker-compose.yml for staging/production
# deployments. Switches from dev mode to optimised production start, removes
# the --import-realm flag (realm must already exist in the database), and
# reduces log verbosity.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.keycloak-prod.yml up
# =============================================================================

services:
  keycloak:
    # --http-enabled=true is required: the reverse proxy terminates TLS and forwards plain
    # HTTP to Keycloak on port 8080; TLS enforcement is handled at the proxy layer.
    command: >
      start
      --optimized
      --proxy-headers=xforwarded
      --http-enabled=true
    environment:
      KC_LOG_LEVEL: warn
      KC_HEALTH_ENABLED: "true"
      # KC_HOSTNAME must be set to the public FQDN in production (e.g. https://auth.example.com)
      # KC_HOSTNAME: "https://auth.example.com"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
