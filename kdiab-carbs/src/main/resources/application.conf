ktor {
    deployment {
        port = 8085
        port = ${?PORT}
    }
    application {
        modules = [ org.javafreedom.kdiab.carbs.ApplicationKt.module ]
    }
}

jwt {
    domain = "http://localhost:8081/realms/kdiab"
    domain = ${?JWT_DOMAIN}
    jwksUrl = "http://localhost:8081/realms/kdiab/protocol/openid-connect/certs"
    jwksUrl = ${?JWKS_URL}
    audience = "carbs"
    audience = ${?JWT_AUDIENCE}
    realm = "kdiab"
    realm = ${?JWT_REALM}
    secret = ${?JWT_SECRET}
}

cors {
    allowedOrigins = "http://localhost:3000"
    allowedOrigins = ${?CORS_ALLOWED_ORIGINS}
}

swagger {
    enabled = false
    enabled = ${?SWAGGER_ENABLED}
}

storage {
    driverClassName = "org.postgresql.Driver"
    jdbcUrl = ${?JDBC_URL}
    username = ${?DB_USER}
    password = ${?DB_PASSWORD}
    maximumPoolSize = 10
    maximumPoolSize = ${?DB_POOL_SIZE}
    isAutoCommit = false
    transactionIsolation = "TRANSACTION_REPEATABLE_READ"
}

logging {
    suppressHealthChecks = true
    suppressHealthChecks = ${?LOGGING_SUPPRESS_HEALTH_CHECKS}
}

json {
    prettyPrint = false
    prettyPrint = ${?JSON_PRETTY_PRINT}
}
