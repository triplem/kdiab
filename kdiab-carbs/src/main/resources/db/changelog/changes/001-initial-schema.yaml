databaseChangeLog:
  - logicalFilePath: db/changelog/db.changelog-root.yaml
  - changeSet:
      id: 001
      author: javafreedom
      changes:
        - createTable:
            tableName: food_entries
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: varchar(200)
                  constraints:
                    nullable: false
              - column:
                  name: portion_grams
                  type: double precision
                  constraints:
                    nullable: false
              - column:
                  name: carbs_per_100g
                  type: double precision
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_food_entries_user_id
            tableName: food_entries
            columns:
              - column:
                  name: user_id
