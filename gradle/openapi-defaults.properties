# Shared OpenAPI generator defaults — read by every service's build.gradle.kts.
# Services override only their service-specific values (inputSpec, packageName, apiPackage,
# modelPackage, and any schema/import mappings unique to that service).

generatorName=kotlin-server

# Type mappings common to all services
typeMapping.UUID=kotlin.String
typeMapping.date-time=kotlin.String

# Global properties: generate models + APIs + supporting files only
globalProperty.models=
globalProperty.apis=
globalProperty.supportingFiles=

# Config options common to all services
configOption.library=ktor
configOption.dateLibrary=java8
configOption.serializationLibrary=kotlinx_serialization
