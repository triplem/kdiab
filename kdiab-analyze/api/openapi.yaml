openapi: "3.1.0"
info:
  title: kdiab-analyze API
  version: 0.1.0
  description: |
    Backend-for-Frontend aggregating measures, treatments, and profiles
    from the three kdiab services into a unified analytics API.
servers:
  - url: http://localhost:8084/api/v1
security:
  - bearerAuth: []

tags:
  - name: Analytics
    description: Analytics and aggregation endpoints

paths:
  /users/{userId}/timeline:
    get:
      operationId: getTimeline
      summary: Combined measures and treatments for a timeframe
      description: Returns all CGM/BGM measures and treatment events for the user within the given time window, merged into a single chronological list.
      parameters:
        - $ref: '#/components/parameters/userId'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
      responses:
        '200':
          description: Combined timeline data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /users/{userId}/analytics/hba1c:
    get:
      operationId: getHba1c
      summary: HbA1c estimation and time-in-range for a timeframe
      description: Computes an estimated HbA1c (DCCT formula) and time-in-range breakdown from CGM readings in the given window. Returns null hba1c if no CGM data is available.
      parameters:
        - $ref: '#/components/parameters/userId'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/glucoseUnit'
      responses:
        '200':
          description: HbA1c analytics result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hba1cResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /users/{userId}/analytics/agp:
    get:
      operationId: getAgp
      summary: Ambulatory Glucose Profile — 5-minute percentiles
      description: Groups CGM readings by 5-minute bucket of the patient's local day and returns p10/p25/p50/p75/p90 percentiles for each bucket. Produces 288 buckets (0–1435 in steps of 5). Buckets with no readings have null percentile values.
      parameters:
        - $ref: '#/components/parameters/userId'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/glucoseUnit'
      responses:
        '200':
          description: AGP 5-minute bucket data (288 buckets)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgpResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /users/{userId}/analytics/device-usage:
    get:
      operationId: getDeviceUsageAnalytics
      summary: Average device wear durations
      description: Computes average and standard deviation of device component wear durations from treatment history. Requires at least 2 events of each type to compute a duration.
      tags: [Analytics]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/userId'
        - name: days
          in: query
          required: false
          description: Number of days to look back (default 90)
          schema:
            type: integer
            default: 90
      responses:
        '200':
          description: Device usage averages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceUsageResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /users/{userId}/analytics/daily-stats:
    get:
      operationId: getDailyStats
      summary: Per-day TIR, percentiles, SD, and eHbA1c statistics
      description: |
        Returns a pre-computed per-day array with TIR zones, glucose percentiles (p25/p50/p75),
        standard deviation, reading count, and eHbA1c — all computed server-side in the patient's
        local timezone. Includes a summary row averaging each metric across days with at least one
        reading. Rows are ordered newest first. Up to 365 days. A warning is emitted if fewer
        than 14 days with readings are found.
      tags: [Analytics]
      parameters:
        - $ref: '#/components/parameters/userId'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/glucoseUnit'
      responses:
        '200':
          description: Daily statistics result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyStatsResponse'
        '400':
          description: Invalid date range or missing parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /users/{userId}/analytics/daily-trend:
    get:
      operationId: getDailyTrend
      summary: Per-day × per-hour glucose trend table
      description: |
        Returns a per-day array of 24 hourly rows. Each row contains the mean CGM glucose for that
        clock hour (in the patient's local timezone), the trend percentage relative to the previous
        hour, the trend zone classification, the glucose zone, the active basal rate from the
        patient's insulin pump profile, and the total carbohydrates consumed in that hour.

        Trend zones: risingFast (≥+20%), rising (+10–20%), stable (±10%), falling (-10–20%),
        fallingFast (≤-20%). Glucose zones: veryHypo (<54), hypo (54–70), inRange (70–180),
        hyper (180–250), veryHyper (>250), noData (no readings). Hour 0 always has null trendPercent.
        Up to 365 days. Carbohydrate data is soft-optional: if the treatments service is unavailable
        carbsG defaults to 0 and a warning is emitted.
      tags: [Analytics]
      parameters:
        - $ref: '#/components/parameters/userId'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/glucoseUnit'
      responses:
        '200':
          description: Daily trend result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyTrendResponse'
        '400':
          description: Invalid date range or missing parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /users/{userId}/analytics/glucose-distribution:
    get:
      operationId: getGlucoseDistribution
      summary: CGM glucose histogram with zone percentages
      description: |
        Returns a histogram of CGM readings bucketed by glucose value (5 mg/dL bins for mg/dL,
        0.3 mmol/L bins for mmol/L), together with zone percentage breakdowns (veryLow / low /
        inRange / high / veryHigh). Up to 365 days of data.
      tags: [Analytics]
      parameters:
        - $ref: '#/components/parameters/userId'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/glucoseUnit'
      responses:
        '200':
          description: Glucose distribution histogram
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlucoseDistributionResponse'
        '400':
          description: Invalid date range or missing parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /users/{userId}/analytics/cgp:
    get:
      operationId: getCgp
      summary: Comprehensive Glucose Pentagon (CGP) with PGR score
      description: |
        Computes the five CGP axes from CGM data in the given timeframe (Vigersky et al. 2018):
        ToR (time out of range, min/day), VarK (CV %), HypoIntensity, HyperIntensity,
        MeanGlucose. All axes are normalised to 0.0 (worst) … 1.0 (healthy reference).
        The PGR score is the geometric mean of the five normalised values multiplied by 5.
      tags: [Analytics]
      parameters:
        - $ref: '#/components/parameters/userId'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/glucoseUnit'
      responses:
        '200':
          description: CGP result with five axes, normalised values, reference values, and PGR score
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CgpResponse'
        '400':
          description: Invalid date range or missing parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /users/{userId}/profiles/active:
    get:
      operationId: getActiveProfiles
      summary: Profiles active during a timeframe
      description: Returns the insulin pump profiles that were active or archived during the given time window, including segment data (basal, ICR, ISF, targets).
      parameters:
        - $ref: '#/components/parameters/userId'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
      responses:
        '200':
          description: Active profiles during the given timeframe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfilesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /users/{userId}/analytics/report-summary:
    get:
      operationId: getReportSummary
      summary: Comprehensive report summary for PDF generation
      description: Returns a single pre-computed summary with eHbA1c, GVI, PGS, GRI, five-zone TIR (profile and standard), treatment averages, and pump event counts for the given timeframe.
      tags: [Analytics]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/userId'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - $ref: '#/components/parameters/glucoseUnit'
      responses:
        '200':
          description: Report summary result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportSummaryResponse'
        '400':
          description: Invalid date range (e.g. range exceeds 365 days)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /users/{userId}/device-age:
    get:
      operationId: getDeviceAge
      summary: Get device component ages (proxy to kdiab-treatments)
      description: Returns the most recent timestamp for each device-related treatment type (catheter, reservoir, CGM sensor). Proxied from kdiab-treatments.
      parameters:
        - $ref: '#/components/parameters/userId'
      responses:
        '200':
          description: Device component timestamps
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceAgeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /users/{userId}/device-status:
    get:
      operationId: getLatestDeviceStatus
      summary: Get latest pump/CGM device status (proxy to kdiab-treatments)
      description: Returns the most recently recorded pump and uploader device status snapshot. Returns 204 if no status has been recorded yet. Proxied from kdiab-treatments.
      parameters:
        - $ref: '#/components/parameters/userId'
      responses:
        '200':
          description: Latest device status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceStatusResponse'
        '204':
          description: No device status found
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    userId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    from:
      name: from
      in: query
      required: true
      description: Start of timeframe (ISO-8601 datetime)
      schema:
        type: string
        format: date-time
    to:
      name: to
      in: query
      required: true
      description: End of timeframe (ISO-8601 datetime)
      schema:
        type: string
        format: date-time
    glucoseUnit:
      name: glucoseUnit
      in: query
      required: false
      description: Glucose unit for display and HbA1c calculation (mg/dL or mmol/L). Defaults to mg/dL.
      schema:
        type: string
        enum: [mg/dL, mmol/L]
        default: mg/dL
        example: mg/dL

  responses:
    Unauthorized:
      description: JWT missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated user lacks access to this resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Too Many Requests
      headers:
        X-RateLimit-Limit:
          schema:
            type: integer
          description: Maximum requests per window
        X-RateLimit-Remaining:
          schema:
            type: integer
          description: Remaining requests in current window
        Retry-After:
          schema:
            type: integer
          description: Seconds until the rate limit resets
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RateLimitErrorResponse'

  schemas:
    TimelineResponse:
      type: object
      required: [measures, treatments]
      properties:
        measures:
          type: array
          items:
            $ref: '#/components/schemas/TimelineMeasure'
        treatments:
          type: array
          items:
            $ref: '#/components/schemas/TimelineTreatment'
        errors:
          type: array
          items:
            type: string
          description: >
            Non-empty when one or more upstream services were unavailable.
            The timeline is returned with whatever data was successfully fetched.

    TimelineMeasureData:
      type: object
      additionalProperties: true

    TimelineTreatmentData:
      type: object
      additionalProperties: true

    TimelineMeasure:
      type: object
      required: [id, userId, timestamp, type]
      properties:
        id:
          type: string
        userId:
          type: string
        timestamp:
          type: string
        type:
          type: string
        source:
          type: string
        data:
          $ref: '#/components/schemas/TimelineMeasureData'

    TimelineTreatment:
      type: object
      required: [id, userId, timestamp, type]
      properties:
        id:
          type: string
        userId:
          type: string
        timestamp:
          type: string
        type:
          type: string
        notes:
          type: ["string", "null"]
        data:
          $ref: '#/components/schemas/TimelineTreatmentData'

    Hba1cResponse:
      type: object
      required: [readingCount, tir]
      properties:
        hba1c:
          type: ["number", "null"]
          format: double
          description: Estimated HbA1c in % (DCCT formula). Null if no CGM readings.
        meanGlucoseMgDl:
          type: ["number", "null"]
          format: double
          description: Mean CGM glucose in mg/dL over the period.
        readingCount:
          type: integer
          description: Total number of CGM readings used.
        tir:
          $ref: '#/components/schemas/TirBreakdown'
        warnings:
          type: array
          items:
            type: string
          description: Data quality warnings about CGM data sufficiency

    TirBreakdown:
      type: object
      required: [veryLowCount, belowCount, inRangeCount, aboveCount, highCount, totalCount]
      properties:
        veryLowCount:
          type: integer
          description: >
            Readings below 54 mg/dL (Level 2 hypoglycaemia — severe).
            International Consensus on TIR (Battelino et al. 2019).
        belowCount:
          type: integer
          description: Readings 54–70 mg/dL (Level 1 hypoglycaemia)
        inRangeCount:
          type: integer
          description: Readings 70–180 mg/dL (target range)
        aboveCount:
          type: integer
          description: Readings 180–250 mg/dL (elevated)
        highCount:
          type: integer
          description: Readings above 250 mg/dL (significantly elevated)
        totalCount:
          type: integer

    AgpResponse:
      type: object
      required: [bucketData]
      properties:
        bucketData:
          type: array
          minItems: 288
          maxItems: 288
          description: 288 five-minute buckets covering a full day (minuteOfDay 0, 5, 10, …, 1435).
          items:
            $ref: '#/components/schemas/AgpBucketData'
        totalReadingCount:
          type: integer
          description: Total number of CGM readings used across all 5-minute buckets.
        sensorWearDays:
          type: integer
          description: Number of distinct calendar days (in the patient's local timezone) with at least one CGM reading.
        warnings:
          type: array
          items:
            type: string
          description: Data quality warnings about CGM data sufficiency

    AgpBucketData:
      type: object
      required: [minuteOfDay]
      properties:
        minuteOfDay:
          type: integer
          minimum: 0
          maximum: 1435
          description: Start of the 5-minute bucket expressed as minutes since midnight (bucketIndex * 5). Values are 0, 5, 10, …, 1435.
          example: 0
        p10:
          type: ["number", "null"]
          format: double
          description: 10th percentile glucose value (mg/dL) for this bucket. Null when the bucket has no readings.
        p25:
          type: ["number", "null"]
          format: double
          description: 25th percentile glucose value (mg/dL) for this bucket. Null when the bucket has no readings.
        median:
          type: ["number", "null"]
          format: double
          description: Median (50th percentile) glucose value (mg/dL) for this bucket. Null when the bucket has no readings.
        p75:
          type: ["number", "null"]
          format: double
          description: 75th percentile glucose value (mg/dL) for this bucket. Null when the bucket has no readings.
        p90:
          type: ["number", "null"]
          format: double
          description: 90th percentile glucose value (mg/dL) for this bucket. Null when the bucket has no readings.
        count:
          type: integer
          description: Number of CGM readings in this bucket.

    ProfilesResponse:
      type: object
      required: [profiles]
      properties:
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/ProfileSummary'

    ProfileSummary:
      type: object
      required: [id, status, name, createdAt]
      properties:
        id:
          type: string
        status:
          type: string
        name:
          type: string
        createdAt:
          type: string
        validFrom:
          type: ["string", "null"]
          description: ISO-8601 timestamp of when the profile entered its current status.
        previousProfileId:
          type: ["string", "null"]
        activatedAt:
          type: ["string", "null"]
          format: date-time
          description: ISO-8601 timestamp of when the profile was activated.
        archivedAt:
          type: ["string", "null"]
          format: date-time
          description: ISO-8601 timestamp of when the profile was archived.
        insulinType:
          type: string
          nullable: true
          description: Name of the insulin used (e.g. NovoRapid).
        durationOfAction:
          type: integer
          format: int32
          nullable: true
          description: Duration of insulin action in minutes.
        basal:
          type: array
          nullable: true
          description: Basal rate schedule segments.
          items:
            $ref: '#/components/schemas/BasalSegment'
        icr:
          type: array
          nullable: true
          description: Insulin-to-carb ratio schedule.
          items:
            $ref: '#/components/schemas/RatioSegment'
        isf:
          type: array
          nullable: true
          description: Insulin sensitivity factor schedule.
          items:
            $ref: '#/components/schemas/RatioSegment'
        targets:
          type: array
          nullable: true
          description: Blood glucose target ranges.
          items:
            $ref: '#/components/schemas/TargetSegment'

    BasalSegment:
      type: object
      required: [startTime, value]
      properties:
        startTime:
          type: string
          description: Segment start time in HH:MM format.
          example: "06:00"
        value:
          type: number
          format: double
          description: Basal rate in U/h.

    RatioSegment:
      type: object
      required: [startTime, value]
      properties:
        startTime:
          type: string
          description: Segment start time in HH:MM format.
          example: "00:00"
        value:
          type: number
          format: double
          description: Ratio value (ICR in g/U; ISF in mg/dL/U or mmol/L/U depending on profile units).

    TargetSegment:
      type: object
      required: [startTime, low, high]
      properties:
        startTime:
          type: string
          description: Segment start time in HH:MM format.
          example: "00:00"
        low:
          type: number
          format: double
          description: Lower bound of the target range.
        high:
          type: number
          format: double
          description: Upper bound of the target range.

    DeviceAgeResponse:
      type: object
      description: Most recent timestamp for each device-related treatment type. Null if that treatment type has never been recorded for the user.
      properties:
        catheterChangedAt:
          type: string
          format: date-time
          nullable: true
          description: When the infusion site/cannula was last replaced (SITE_CHANGE).
          example: "2026-05-14T10:30:00Z"
        reservoirChangedAt:
          type: string
          format: date-time
          nullable: true
          description: When the insulin cartridge was last replaced (INSULIN_CHANGE).
          example: "2026-05-13T08:00:00Z"
        sensorInsertedAt:
          type: string
          format: date-time
          nullable: true
          description: When the CGM sensor was last inserted (SENSOR_INSERT).
          example: "2026-05-12T18:00:00Z"
        batteryChangedAt:
          type: string
          format: date-time
          nullable: true
          description: When the pump battery was last replaced (PUMP_BATTERY_CHANGE).
          example: "2026-05-10T14:00:00Z"

    DeviceStatusResponse:
      type: object
      description: Most recent pump and uploader device status snapshot for a user.
      required: [id, userId, recordedAt, device]
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the device status record.
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        userId:
          type: string
          format: uuid
          description: User the status belongs to.
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        recordedAt:
          type: string
          format: date-time
          description: When the status was recorded by the APS client.
          example: "2026-05-16T10:00:00Z"
        device:
          type: string
          description: Name and version of the uploading client application.
          example: "AAPS 3.2.0"
        pumpName:
          type: string
          nullable: true
          description: Pump model identifier as reported by the client.
          example: "Dana RS"
        reservoirUnits:
          type: number
          format: double
          nullable: true
          description: Insulin units remaining in the pump reservoir.
          example: 142.5
        batteryLevel:
          type: integer
          format: int32
          nullable: true
          description: Pump battery level as a percentage (0–100).
          minimum: 0
          maximum: 100
          example: 87
        pumpConnected:
          type: boolean
          nullable: true
          description: Whether the pump was connected at the time of the status report.
          example: true

    DeviceUsageResult:
      type: object
      required: [userId]
      properties:
        userId:
          type: string
          description: The user this result belongs to
        avgSensorDays:
          type: ["number", "null"]
          format: double
          description: Average sensor wear duration in days. Null if fewer than 2 SENSOR_INSERT events exist.
        stddevSensorDays:
          type: ["number", "null"]
          format: double
          description: Population standard deviation of sensor wear duration in days.
        avgCatheterDays:
          type: ["number", "null"]
          format: double
          description: Average catheter/cannula wear duration in days. Null if fewer than 2 SITE_CHANGE events exist.
        stddevCatheterDays:
          type: ["number", "null"]
          format: double
          description: Population standard deviation of catheter wear duration in days.
        avgReservoirDays:
          type: ["number", "null"]
          format: double
          description: Average reservoir/insulin cartridge wear duration in days. Null if fewer than 2 INSULIN_CHANGE events exist.
        stddevReservoirDays:
          type: ["number", "null"]
          format: double
          description: Population standard deviation of reservoir wear duration in days.
        avgBatteryDays:
          type: ["number", "null"]
          format: double
          description: Average pump battery wear duration in days. Null if fewer than 2 PUMP_BATTERY_CHANGE events exist.
        stddevBatteryDays:
          type: ["number", "null"]
          format: double
          description: Population standard deviation of battery wear duration in days.

    DailyStatRow:
      type: object
      description: Per-day CGM statistics row. Numeric fields are null when no CGM readings exist for that day.
      required:
        - date
        - cgmCount
      properties:
        date:
          type: string
          description: Calendar date in patient's local timezone (YYYY-MM-DD), or "summary" for the aggregate row.
          example: "2024-01-15"
        cgmCount:
          type: integer
          format: int32
          description: Number of CGM readings on this day.
          example: 288
        veryLowPercent:
          type: ["number", "null"]
          format: double
          description: Percentage of readings below 54 mg/dL (Level 2 hypoglycaemia). Null if no readings.
        lowPercent:
          type: ["number", "null"]
          format: double
          description: Percentage of readings in 54–70 mg/dL (Level 1 hypoglycaemia). Null if no readings.
        inRangePercent:
          type: ["number", "null"]
          format: double
          description: Percentage of readings in 70–180 mg/dL (target range). Null if no readings.
        highPercent:
          type: ["number", "null"]
          format: double
          description: Percentage of readings in 180–250 mg/dL (hyperglycaemia). Null if no readings.
        veryHighPercent:
          type: ["number", "null"]
          format: double
          description: Percentage of readings above 250 mg/dL (severe hyperglycaemia). Null if no readings.
        p25:
          type: ["number", "null"]
          format: double
          description: 25th percentile glucose in mg/dL. Null if no readings.
        median:
          type: ["number", "null"]
          format: double
          description: Median (50th percentile) glucose in mg/dL. Null if no readings.
        p75:
          type: ["number", "null"]
          format: double
          description: 75th percentile glucose in mg/dL. Null if no readings.
        sd:
          type: ["number", "null"]
          format: double
          description: Population standard deviation of glucose in mg/dL. Null if no readings.
        eHbA1c:
          type: ["number", "null"]
          format: double
          description: Estimated HbA1c (%) via DCCT formula — (mean_mg_dL + 46.7) / 28.7. Null if no readings.

    DailyStatsResponse:
      type: object
      description: Per-day CGM statistics for the requested date range.
      required:
        - rows
        - summary
      properties:
        rows:
          type: array
          description: One row per calendar day, ordered newest first. Includes days with zero readings.
          items:
            $ref: '#/components/schemas/DailyStatRow'
        summary:
          $ref: '#/components/schemas/DailyStatRow'
          description: Average of all metrics across days with at least one CGM reading. date="summary".
        warnings:
          type: array
          description: Clinical or data-quality warnings (e.g. fewer than 14 days with readings).
          items:
            type: string

    HourlyTrendRow:
      type: object
      description: Hourly row in a daily trend result. All computed fields are null when no CGM readings exist for that hour.
      required: [hour, carbsG]
      properties:
        hour:
          type: integer
          description: Clock hour in the patient's local timezone (0–23).
          example: 14
        meanGlucose:
          type: ["number", "null"]
          format: double
          description: Mean CGM glucose for this hour in mg/dL. Null if no readings.
          example: 128.5
        trendPercent:
          type: ["number", "null"]
          format: double
          description: Percentage change relative to the previous hour's mean glucose. Null for hour 0 or when either hour has no data.
          example: 12.3
        trendZone:
          type: ["string", "null"]
          description: |
            Trend classification: risingFast (≥+20%), rising (+10–20%), stable (±10%),
            falling (-10–20%), fallingFast (≤-20%). Null when trendPercent is null.
          enum: [risingFast, rising, stable, falling, fallingFast, null]
          example: rising
        zone:
          type: ["string", "null"]
          description: Glucose zone based on meanGlucose. veryHypo (<54), hypo (54–70), inRange (70–180), hyper (180–250), veryHyper (>250), noData (no readings).
          enum: [veryHypo, hypo, inRange, hyper, veryHyper, noData, null]
          example: inRange
        basalRateIePerH:
          type: ["number", "null"]
          format: double
          description: Active basal rate from the patient's insulin pump profile for this hour (IU/h). Null if no profile is available.
          example: 0.85
        carbsG:
          type: number
          format: double
          description: Total carbohydrates consumed in this hour (grams). 0 if no carb entries or treatments service unavailable.
          example: 45.0

    DailyTrendDay:
      type: object
      description: All 24 hourly trend rows for a single calendar day.
      required: [date, hours]
      properties:
        date:
          type: string
          description: Calendar date in YYYY-MM-DD format (patient's local timezone).
          example: "2024-01-15"
        hours:
          type: array
          description: Exactly 24 entries, one per clock hour 0–23 in the patient's local timezone.
          items:
            $ref: '#/components/schemas/HourlyTrendRow'
          minItems: 24
          maxItems: 24

    DailyTrendResponse:
      type: object
      description: Per-day × per-hour glucose trend result.
      required: [days]
      properties:
        days:
          type: array
          description: One entry per calendar day with CGM data, ordered chronologically. Up to 365 days.
          items:
            $ref: '#/components/schemas/DailyTrendDay'
        warnings:
          type: array
          items:
            type: string
          description: Data quality warnings (e.g. range truncated to 365 days, carbohydrate data unavailable).

    GlucoseBucket:
      type: object
      description: A single histogram bucket covering a glucose value range.
      required: [lowerBound, upperBound, count, percent, zone]
      properties:
        lowerBound:
          type: number
          format: double
          description: Inclusive lower bound of this bucket (in the requested glucose unit).
          example: 70.0
        upperBound:
          type: number
          format: double
          description: Exclusive upper bound of this bucket (in the requested glucose unit).
          example: 75.0
        count:
          type: integer
          description: Number of CGM readings that fall in this bucket.
    TirZone:
      type: object
      description: A single TIR zone with count and percentage.
      required: [count, percent]
      properties:
        count:
          type: integer
          format: int32
          description: Number of CGM readings in this zone.
          example: 42
        percent:
          type: number
          format: double
          description: Percentage of total readings represented by this bucket (0–100).
          example: 14.6
        zone:
          type: string
          description: Glucose zone this bucket belongs to (veryLow, low, inRange, high, veryHigh).
          example: inRange

    ZonePercents:
      type: object
      description: Percentage of CGM readings in each glucose zone.
      required: [veryLow, low, inRange, high, veryHigh]
      properties:
        veryLow:
          type: number
          format: double
          description: Percentage of readings below 54 mg/dL (Level 2 hypoglycaemia).
          example: 1.2
        low:
          type: number
          format: double
          description: Percentage of readings 54–70 mg/dL (Level 1 hypoglycaemia).
          example: 3.4
        inRange:
          type: number
          format: double
          description: Percentage of readings 70–180 mg/dL (target range).
          example: 72.1
        high:
          type: number
          format: double
          description: Percentage of readings 180–250 mg/dL (elevated).
          example: 18.9
        veryHigh:
          type: number
          format: double
          description: Percentage of readings above 250 mg/dL (significantly elevated).
          example: 4.4

    GlucoseDistributionResponse:
      type: object
      description: CGM glucose histogram with zone percentage breakdowns.
      required: [buckets, zonePercents, unit, totalCount]
      properties:
        buckets:
          type: array
          description: Histogram buckets ordered by lowerBound ascending.
          items:
            $ref: '#/components/schemas/GlucoseBucket'
        zonePercents:
          $ref: '#/components/schemas/ZonePercents'
        unit:
          type: string
          description: Glucose unit used for bucket bounds (mg/dL or mmol/L).
          example: mg/dL
        totalCount:
          type: integer
          description: Total number of CGM readings included in the histogram.
          example: 8640
    TirResult:
      type: object
      description: Five-zone TIR breakdown with optional custom thresholds from the active basal profile.
      required: [veryLow, low, inRange, high, veryHigh, customTirFallback]
      properties:
        veryLow:
          $ref: '#/components/schemas/TirZone'
          description: Readings < 54 mg/dL (Level 2 hypoglycaemia).
        low:
          $ref: '#/components/schemas/TirZone'
          description: Readings in the low zone (54 mg/dL to analysisLow or 70 mg/dL).
        inRange:
          $ref: '#/components/schemas/TirZone'
          description: Readings in the target range (analysisLow to analysisHigh, or 70–180 mg/dL).
        high:
          $ref: '#/components/schemas/TirZone'
          description: Readings in the high zone (analysisHigh to 250 mg/dL, or 180–250 mg/dL).
        veryHigh:
          $ref: '#/components/schemas/TirZone'
          description: Readings > 250 mg/dL (severe hyperglycaemia).
        customTirFallback:
          type: boolean
          description: True when the profile had no analysisLow/High and standard 70/180 thresholds were used.
          example: false

    ReportSummaryResponse:
      type: object
      description: Comprehensive report summary for PDF generation.
      required:
        - displayName
        - daysAnalysed
        - cgmReadingCount
        - cgmIntervalMinutes
        - insulinTypes
        - insulinChanges
        - siteChanges
        - sensorInserts
        - tirProfile
        - tirStandard
        - warnings
      properties:
        displayName:
          type: string
          description: User display name (userId string when no display name is available).
          example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        daysAnalysed:
          type: integer
          format: int32
          description: Number of days covered by the report range.
          example: 30
        cgmReadingCount:
          type: integer
          format: int32
          description: Total CGM readings used for the analysis.
          example: 8640
        cgmIntervalMinutes:
          type: integer
          format: int32
          description: Estimated CGM sampling interval in minutes.
          example: 5
        insulinTypes:
          type: array
          items:
            type: string
          description: Distinct insulin type names from all active/archived profiles in the period.
          example: ["NovoRapid"]
        insulinChanges:
          type: integer
          format: int32
          description: Number of INSULIN_CHANGE treatment events in the period.
          example: 6
        avgDaysPerCartridge:
          type: ["number", "null"]
          format: double
          description: Average days per cartridge (daysAnalysed / insulinChanges). Null if zero events.
          example: 5.0
        siteChanges:
          type: integer
          format: int32
          description: Number of SITE_CHANGE treatment events in the period.
          example: 10
        avgDaysPerSite:
          type: ["number", "null"]
          format: double
          description: Average days per infusion site (daysAnalysed / siteChanges). Null if zero events.
          example: 3.0
        sensorInserts:
          type: integer
          format: int32
          description: Number of SENSOR_INSERT treatment events in the period.
          example: 4
        avgDaysPerSensor:
          type: ["number", "null"]
          format: double
          description: Average days per CGM sensor (daysAnalysed / sensorInserts). Null if zero events.
          example: 7.5
        tirProfile:
          $ref: '#/components/schemas/TirResult'
          description: Five-zone TIR using analysisLow/High thresholds from the active profile (falls back to 70/180).
        tirStandard:
          $ref: '#/components/schemas/TirResult'
          description: Five-zone TIR using fixed standard thresholds (54/70/180/250 mg/dL).
        minGlucose:
          type: ["number", "null"]
          format: double
          description: Minimum CGM glucose value in mg/dL. Null if no readings.
          example: 48.0
        maxGlucose:
          type: ["number", "null"]
          format: double
          description: Maximum CGM glucose value in mg/dL. Null if no readings.
          example: 312.0
        meanGlucose:
          type: ["number", "null"]
          format: double
          description: Mean CGM glucose in mg/dL. Null if no readings.
          example: 138.5
        sd:
          type: ["number", "null"]
          format: double
          description: Population standard deviation of CGM glucose in mg/dL. Null if fewer than 2 readings.
          example: 34.2
        gvi:
          type: ["number", "null"]
          format: double
          description: Glycaemic Variability Index (SD / mean glucose, Peyser 2011). Null if no readings.
          example: 0.247
        pgs:
          type: ["number", "null"]
          format: double
          description: >
            Patient Glycaemic Status (Rodbard 2011):
            mean_BG × (%time≥180 fraction) + (110 − mean_BG) × (%time≤70 fraction); floored at 0.
          example: 4.3
        gri:
          type: ["number", "null"]
          format: double
          description: >
            Glycaemia Risk Index (Klonoff 2023):
            3.0×(%<54) + 2.4×(%54–70) + 1.6×(%180–250) + 0.8×(%>250). Range 0–100.
          example: 18.4
        griZone:
          type: ["string", "null"]
          description: GRI zone letter (A ≤20, B ≤40, C ≤60, D ≤80, E >80). Null if no readings.
          example: "A"
        eHbA1c:
          type: ["number", "null"]
          format: double
          description: Estimated HbA1c in % (DCCT/ADAG formula). Null if no readings.
          example: 6.7
        avgCarbsPerDayG:
          type: ["number", "null"]
          format: double
          description: Average carbohydrate intake per day in grams. Null if no CARBS events.
          example: 185.0
        avgBolusPerDayIe:
          type: ["number", "null"]
          format: double
          description: Average bolus insulin per day in units (BOLUS + CORRECTION_BOLUS + COMBO_BOLUS).
          example: 18.4
        bolusPercent:
          type: ["number", "null"]
          format: double
          description: Bolus insulin as a percentage of total daily insulin. Null if total is zero.
          example: 42.5
        avgBasalPerDayIe:
          type: ["number", "null"]
          format: double
          description: Average basal insulin per day in units (scheduled basal adjusted by TEMP_BASAL events).
          example: 24.9
        basalPercent:
          type: ["number", "null"]
          format: double
          description: Basal insulin as a percentage of total daily insulin. Null if total is zero.
          example: 57.5
        avgTotalInsulinPerDayIe:
          type: ["number", "null"]
          format: double
          description: Average total daily insulin (bolus + basal). Null if no insulin data.
          example: 43.3
        warnings:
          type: array
          items:
            type: string
          description: Data quality warnings. Includes "lessThan14Days" when the range is below 14 days.
          example: []

    CgpResponse:
      type: object
      description: Comprehensive Glucose Pentagon result with five axes, normalised scores, reference values, and PGR score.
      required:
        - tor
        - varK
        - hypoIntensity
        - hyperIntensity
        - meanGlucose
        - normTor
        - normVarK
        - normHypo
        - normHyper
        - normMeanGlucose
        - refTor
        - refVarK
        - refHypo
        - refHyper
        - refMeanGlucose
        - pgr
        - pgrRisk
        - warnings
      properties:
        tor:
          type: number
          format: double
          description: Time out of range (minutes per day; glucose < 70 or > 180 mg/dL).
          example: 120.5
        varK:
          type: number
          format: double
          description: Coefficient of variation (%).
          example: 28.3
        hypoIntensity:
          type: number
          format: double
          description: Mean hypo intensity (sum of (70-g)^2 × 5/1440 per reading / days).
          example: 45.2
        hyperIntensity:
          type: number
          format: double
          description: Mean hyper intensity (sum of (g-180)^2 × 5/1440 per reading / days).
          example: 320.7
        meanGlucose:
          type: number
          format: double
          description: Mean CGM glucose in mg/dL.
          example: 145.0
        normTor:
          type: number
          format: double
          description: Normalised ToR axis value (0.0 = worst, 1.0 = healthy reference).
          example: 0.72
        normVarK:
          type: number
          format: double
          description: Normalised VarK axis value.
          example: 0.43
        normHypo:
          type: number
          format: double
          description: Normalised HypoIntensity axis value.
          example: 0.99
        normHyper:
          type: number
          format: double
          description: Normalised HyperIntensity axis value.
          example: 0.85
        normMeanGlucose:
          type: number
          format: double
          description: Normalised MeanGlucose axis value.
          example: 0.78
        refTor:
          type: number
          format: double
          description: Reference ToR for healthy subjects without diabetes (min/day).
          example: 0.0
        refVarK:
          type: number
          format: double
          description: Reference CV for healthy subjects (%).
          example: 12.5
        refHypo:
          type: number
          format: double
          description: Reference HypoIntensity for healthy subjects.
          example: 0.0
        refHyper:
          type: number
          format: double
          description: Reference HyperIntensity for healthy subjects.
          example: 0.0
        refMeanGlucose:
          type: number
          format: double
          description: Reference mean glucose for healthy subjects (mg/dL).
          example: 100.0
        pgr:
          type: number
          format: double
          description: PGR score (geometric mean of 5 normalised axes × 5, range 0–5).
          example: 3.4
        pgrRisk:
          type: string
          description: PGR risk category.
          enum: [very_low, low, moderate, high, very_high]
          example: moderate
        warnings:
          type: array
          items:
            type: string
          description: Data quality warnings.
          example: []

    ErrorResponse:
      type: object
      description: Standard error envelope returned by all error responses
      required:
        - code
        - message
      properties:
        code:
          type: integer
          description: HTTP status code
        message:
          type: string
          description: Human-readable error description

    RateLimitErrorResponse:
      type: object
      description: Error envelope returned when the rate limit is exceeded
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Error code identifier
          example: RATE_LIMIT_EXCEEDED
        message:
          type: string
          description: Human-readable error description
          example: Too many requests
