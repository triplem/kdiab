openapi: "3.1.0"
info:
  title: kdiab-analyze API
  version: 0.1.0
  description: |
    Backend-for-Frontend aggregating measures, treatments, and profiles
    from the three kdiab services into a unified analytics API.
servers:
  - url: http://localhost:8084/api/v1
security:
  - bearerAuth: []

paths:
  /users/{userId}/timeline:
    get:
      operationId: getTimeline
      summary: Combined measures and treatments for a timeframe
      description: Returns all CGM/BGM measures and treatment events for the user within the given time window, merged into a single chronological list.
      parameters:
        - $ref: '#/components/parameters/userId'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
      responses:
        '200':
          description: Combined timeline data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users/{userId}/analytics/hba1c:
    get:
      operationId: getHba1c
      summary: HbA1c estimation and time-in-range for a timeframe
      description: Computes an estimated HbA1c (DCCT formula) and time-in-range breakdown from CGM readings in the given window. Returns null hba1c if no CGM data is available.
      parameters:
        - $ref: '#/components/parameters/userId'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
      responses:
        '200':
          description: HbA1c analytics result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hba1cResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users/{userId}/analytics/agp:
    get:
      operationId: getAgp
      summary: Ambulatory Glucose Profile — hourly percentiles
      description: Groups CGM readings by UTC hour (0–23) and returns p10/p25/p50/p75/p90 percentiles for each bucket. Buckets with no readings have null percentile values.
      parameters:
        - $ref: '#/components/parameters/userId'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
      responses:
        '200':
          description: AGP hourly data (24 buckets)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgpResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users/{userId}/profiles/active:
    get:
      operationId: getActiveProfiles
      summary: Profiles active during a timeframe
      description: Returns the insulin pump profiles that were active or archived during the given time window, including segment data (basal, ICR, ISF, targets).
      parameters:
        - $ref: '#/components/parameters/userId'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
      responses:
        '200':
          description: Active profiles during the given timeframe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfilesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    userId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    from:
      name: from
      in: query
      required: true
      description: Start of timeframe (ISO-8601 datetime)
      schema:
        type: string
        format: date-time
    to:
      name: to
      in: query
      required: true
      description: End of timeframe (ISO-8601 datetime)
      schema:
        type: string
        format: date-time

  responses:
    Unauthorized:
      description: JWT missing or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated user lacks access to this resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    TimelineResponse:
      type: object
      required: [measures, treatments]
      properties:
        measures:
          type: array
          items:
            $ref: '#/components/schemas/TimelineMeasure'
        treatments:
          type: array
          items:
            $ref: '#/components/schemas/TimelineTreatment'
        errors:
          type: array
          items:
            type: string
          description: >
            Non-empty when one or more upstream services were unavailable.
            The timeline is returned with whatever data was successfully fetched.

    TimelineMeasureData:
      type: object
      additionalProperties: true

    TimelineTreatmentData:
      type: object
      additionalProperties: true

    TimelineMeasure:
      type: object
      required: [id, userId, timestamp, type]
      properties:
        id:
          type: string
        userId:
          type: string
        timestamp:
          type: string
        type:
          type: string
        source:
          type: string
        data:
          $ref: '#/components/schemas/TimelineMeasureData'

    TimelineTreatment:
      type: object
      required: [id, userId, timestamp, type]
      properties:
        id:
          type: string
        userId:
          type: string
        timestamp:
          type: string
        type:
          type: string
        notes:
          type: ["string", "null"]
        data:
          $ref: '#/components/schemas/TimelineTreatmentData'

    Hba1cResponse:
      type: object
      required: [readingCount, tir]
      properties:
        hba1c:
          type: ["number", "null"]
          format: double
          description: Estimated HbA1c in % (DCCT formula). Null if no CGM readings.
        meanGlucoseMgDl:
          type: ["number", "null"]
          format: double
          description: Mean CGM glucose in mg/dL over the period.
        readingCount:
          type: integer
          description: Total number of CGM readings used.
        tir:
          $ref: '#/components/schemas/TirBreakdown'
        warnings:
          type: array
          items:
            type: string
          description: Data quality warnings about CGM data sufficiency

    TirBreakdown:
      type: object
      required: [veryLowCount, belowCount, inRangeCount, aboveCount, highCount, totalCount]
      properties:
        veryLowCount:
          type: integer
          description: >
            Readings below 54 mg/dL (Level 2 hypoglycaemia — severe).
            International Consensus on TIR (Battelino et al. 2019).
        belowCount:
          type: integer
          description: Readings 54–70 mg/dL (Level 1 hypoglycaemia)
        inRangeCount:
          type: integer
          description: Readings 70–180 mg/dL (target range)
        aboveCount:
          type: integer
          description: Readings 180–250 mg/dL (elevated)
        highCount:
          type: integer
          description: Readings above 250 mg/dL (significantly elevated)
        totalCount:
          type: integer

    AgpResponse:
      type: object
      required: [hourlyData]
      properties:
        hourlyData:
          type: array
          minItems: 24
          maxItems: 24
          items:
            $ref: '#/components/schemas/AgpHourlyData'
        totalReadingCount:
          type: integer
          description: Total number of CGM readings used across all hourly buckets.
        sensorWearDays:
          type: integer
          description: Number of distinct calendar days (UTC) with at least one CGM reading.
        warnings:
          type: array
          items:
            type: string
          description: Data quality warnings about CGM data sufficiency

    AgpHourlyData:
      type: object
      required: [hour]
      properties:
        hour:
          type: integer
          minimum: 0
          maximum: 23
        p10:
          type: ["number", "null"]
          format: double
        p25:
          type: ["number", "null"]
          format: double
        median:
          type: ["number", "null"]
          format: double
        p75:
          type: ["number", "null"]
          format: double
        p90:
          type: ["number", "null"]
          format: double
        count:
          type: integer

    ProfilesResponse:
      type: object
      required: [profiles]
      properties:
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/ProfileSummary'

    ProfileSummary:
      type: object
      required: [id, status, name, createdAt]
      properties:
        id:
          type: string
        status:
          type: string
        name:
          type: string
        createdAt:
          type: string
        validFrom:
          type: ["string", "null"]
          description: ISO-8601 timestamp of when the profile entered its current status.
        previousProfileId:
          type: ["string", "null"]
        activatedAt:
          type: ["string", "null"]
          format: date-time
          description: ISO-8601 timestamp of when the profile was activated.
        archivedAt:
          type: ["string", "null"]
          format: date-time
          description: ISO-8601 timestamp of when the profile was archived.

    ErrorResponse:
      type: object
      description: Standard error envelope returned by all error responses
      required:
        - code
        - message
      properties:
        code:
          type: integer
          description: HTTP status code
        message:
          type: string
          description: Human-readable error description
