# Opt-in OpenTelemetry observability overlay.
# Usage: docker compose -f docker-compose.yml -f docker-compose.otel.yml up
# Or via Podman: ./podman-up.sh -o --build
#
# Sets OTEL_TRACES_EXPORTER/OTEL_METRICS_EXPORTER=otlp and
# OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318 in the shell
# so all kdiab backends forward telemetry to the collector.

services:
  otel-collector:
    container_name: kdiab-otel-collector
    # Pin to digest when available: otel/opentelemetry-collector-contrib:0.127.0@sha256:<digest>
    image: otel/opentelemetry-collector-contrib:0.127.0
    command: ["--config=/etc/otel/otel-collector-config.yaml"]
    volumes:
      - ./config/otel/otel-collector-config.yaml:/etc/otel/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus metrics exposition
    networks:
      - shared
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M
          cpus: '0.1'

  jaeger:
    container_name: kdiab-jaeger
    # Pin to digest when available: jaegertracing/jaeger:2.7.0@sha256:<digest>
    # jaegertracing/jaeger is the unified all-in-one image introduced in Jaeger 2.x
    image: jaegertracing/jaeger:2.7.0
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"   # Jaeger UI
      - "14317:4317"    # Jaeger OTLP gRPC (host-side remapped; otel-collector uses port 4317)
    networks:
      - shared
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M
          cpus: '0.25'

  prometheus:
    container_name: kdiab-prometheus
    # Pin to digest when available: prom/prometheus:v3.4.0@sha256:<digest>
    image: prom/prometheus:v3.4.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./config/otel/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - shared
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M
          cpus: '0.25'

  grafana:
    container_name: kdiab-grafana
    # Pin to digest when available: grafana/grafana:12.0.1@sha256:<digest>
    image: grafana/grafana:12.0.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/otel/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/otel/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3010:3000"
    depends_on:
      - prometheus
      - jaeger
    networks:
      - shared
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M
          cpus: '0.1'

volumes:
  prometheus_data:
  grafana_data:
