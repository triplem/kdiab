# OpenTelemetry observability overlay — included by default in podman-up.sh.
# Usage: docker compose -f docker-compose.yml -f docker-compose.otel.yml up
# Or via Podman: ./podman-up.sh --build  (OTEL is always included)
#
# Requires OTEL_TRACES_EXPORTER=otlp, OTEL_METRICS_EXPORTER=otlp, and
# OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317 in the environment
# so all kdiab backends forward telemetry to the collector (podman-up.sh sets
# these automatically).
#
# kdiab backends connect via internal Docker hostnames — host-side ports don't matter
# for the app. Host ports are remapped so this stack can coexist with the Claude Code
# OTEL stack (docker-compose.claude-otel.yml), which occupies the standard ports.
#
# Port map (host:container):
#   OTLP gRPC   14317:4317  (Claude Code OTEL: 4317)
#   OTLP HTTP   14318:4318  (Claude Code OTEL: 4318)
#   Jaeger UI   16690:16686 (Claude Code OTEL: 16686)
#   Jaeger gRPC 24317:4317  (remapped; Claude Code OTEL uses 14317 for its own Jaeger)
#   Prometheus  9091:9090   (Claude Code OTEL: 9090)
#   Grafana     3001:3000   (Claude Code OTEL: 3000)
#   Loki        13100:3100  (Claude Code OTEL: 3100)

services:
  otel-collector:
    container_name: kdiab-otel-collector
    # Pin to digest when available: otel/opentelemetry-collector-contrib:0.127.0@sha256:<digest>
    image: otel/opentelemetry-collector-contrib:0.127.0
    command: ["--config=/etc/otel/otel-collector-config.yaml"]
    volumes:
      - ./config/otel/otel-collector-config.yaml:/etc/otel/otel-collector-config.yaml:ro
    ports:
      - "14317:4317"   # OTLP gRPC (standard 4317 reserved for Claude Code OTEL stack)
      - "14318:4318"   # OTLP HTTP (standard 4318 reserved for Claude Code OTEL stack)
    networks:
      - shared
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M
          cpus: '0.1'

  jaeger:
    container_name: kdiab-jaeger
    # Pin to digest when available: jaegertracing/jaeger:2.7.0@sha256:<digest>
    # jaegertracing/jaeger is the unified all-in-one image introduced in Jaeger 2.x
    image: jaegertracing/jaeger:2.7.0
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16690:16686"   # Jaeger UI (standard 16686 reserved for Claude Code OTEL stack)
      - "24317:4317"    # Jaeger OTLP gRPC (remapped; host 14317 used by otel-collector above)
    networks:
      - shared
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:16686"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M
          cpus: '0.25'


  kdiab-prometheus:
    container_name: kdiab-prometheus
    # Pin to digest when available: prom/prometheus:v3.4.0@sha256:<digest>
    image: prom/prometheus:v3.4.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --log.level=warn
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./config/otel/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_kdiab_data:/prometheus
    ports:
      - "9091:9090"   # Prometheus UI (standard 9090 reserved for Claude Code OTEL stack)
    networks:
      - shared
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M
          cpus: '0.1'

  loki:
    container_name: kdiab-loki
    # Pin to digest when available: grafana/loki:3.5.0@sha256:<digest>
    image: grafana/loki:3.5.0
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./config/otel/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    ports:
      - "13100:3100"  # Loki API (Claude Code OTEL Loki: 3100)
    networks:
      - shared
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M
          cpus: '0.1'

  kdiab-grafana:
    container_name: kdiab-grafana
    # Pin to digest when available: grafana/grafana:12.0.1@sha256:<digest>
    image: grafana/grafana:12.0.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_LOG_LEVEL: warn
    volumes:
      - grafana_kdiab_data:/var/lib/grafana
      - ./config/otel/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/otel/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"   # Grafana UI (standard 3000 reserved for Claude Code OTEL stack)
    depends_on:
      kdiab-prometheus:
        condition: service_healthy
      jaeger:
        condition: service_healthy
      loki:
        condition: service_started
    networks:
      - shared
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M
          cpus: '0.1'


  # When OTEL is active, point Keycloak's tracer at the HTTP endpoint (port 4318).
  # Backends use gRPC (port 4317) via OTEL_EXPORTER_OTLP_ENDPOINT; Keycloak
  # requires the HTTP endpoint controlled by KC_OTEL_ENDPOINT.
  keycloak:
    environment:
      KC_OTEL_ENDPOINT: http://otel-collector:4318

volumes:
  prometheus_kdiab_data:
  grafana_kdiab_data:
  loki_data:
