# ── Gradle daemon JVM memory ──────────────────────────────────────────────────
# (#613) 2 GB heap + 512 MB Metaspace is sufficient for incremental builds.
# During a full `./gradlew clean dockerBuild`, peak usage is dominated by
# the Kotlin compiler daemons (one per included build) rather than the Gradle
# daemon itself. Run with --no-parallel to serialise daemon launches:
#   ./gradlew clean dockerBuild --no-parallel
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# ── Build behaviour ───────────────────────────────────────────────────────────
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.daemon=true

# ── Kotlin daemon ─────────────────────────────────────────────────────────────
kotlin.daemon.jvmargs=-Xmx2g
