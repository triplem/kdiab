server {
    listen 8080;

    # Unified entry point — route by path prefix to the corresponding frontend
    # Each frontend is built with VITE_BASE_PATH matching its location block,
    # so static assets and API calls include the service prefix and route back here.

    # Full path is forwarded (no trailing slash = no prefix stripping).
    # Each upstream nginx has a matching location /service/ block so it can
    # serve assets and proxy API requests at that prefix directly.

    location /measures/ {
        proxy_pass         http://measures-frontend:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /profiles/ {
        proxy_pass         http://profiles-frontend:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /treatments/ {
        proxy_pass         http://treatments-frontend:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /analyze/ {
        proxy_pass         http://analyze-frontend:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location = / {
        return 302 /measures/;
    }
}
