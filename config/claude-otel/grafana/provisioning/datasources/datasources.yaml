apiVersion: 1
datasources:
  - name: Prometheus
    uid: claude-prometheus
    type: prometheus
    url: http://claude-prometheus:9090
    isDefault: true
    jsonData:
      httpMethod: POST
  - name: Jaeger
    uid: claude-jaeger
    type: jaeger
    url: http://claude-jaeger:16686
    jsonData:
      tracesToMetrics:
        datasourceUid: claude-prometheus
