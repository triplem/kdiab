apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://claude-prometheus:9090
    isDefault: true
    uid: claude-prometheus

  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://claude-jaeger:16686
    uid: claude-jaeger
    jsonData:
      tracesToLogsV2:
        datasourceUid: ''
