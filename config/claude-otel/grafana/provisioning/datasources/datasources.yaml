apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://claude-prometheus:9090
    isDefault: true
    uid: prometheus

  - name: Loki
    type: loki
    access: proxy
    url: http://claude-loki:3100
    uid: loki

  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://claude-jaeger:16686
    uid: claude-jaeger
