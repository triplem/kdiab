global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Scrape metrics that kdiab backends forward via OTLP → prometheus exporter.
  # A single job scrapes the collector's Prometheus exporter endpoint (port 8889).
  # Individual kdiab service metrics are distinguished by the 'service_name' label
  # set by each backend's OTEL SDK.  The job label 'kdiab-metrics' matches the
  # dashboard query filter job=~"kdiab.*".
  - job_name: kdiab-metrics
    static_configs:
      - targets:
          - otel-collector:8889
    # The prometheus exporter adds an 'otel_scope_name' label by default;
    # drop it to keep metric cardinality low.
    metric_relabel_configs:
      - action: labeldrop
        regex: otel_scope_(name|version)
