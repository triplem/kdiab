global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Full metrics data path:
  #   kdiab backends (8 services)
  #     → OTLP gRPC → otel-collector:4317  (internal Docker network)
  #     → Prometheus exporter endpoint  otel-collector:8889/metrics
  #   Prometheus → scrapes otel-collector:8889 under this job name
  #
  # OTEL_EXPORTER_OTLP_ENDPOINT is set to http://otel-collector:4317 by podman-up.sh
  # when the otel overlay is active; the default in docker-compose.yml is localhost:4317
  # (no-op without the overlay).  Each backend sets OTEL_SERVICE_NAME so individual
  # services are distinguished by the 'service_name' label on every metric series.
  #
  # Dashboard PromQL uses job=~"kdiab.*" to filter series from this scrape job.
  # The job_name MUST start with "kdiab" for that filter to match.  The previous
  # name "kdiab-otel-collector" also satisfied the regex, but "kdiab-metrics" is
  # more semantically accurate (the job represents kdiab app metrics, not
  # collector internals).
  - job_name: kdiab-metrics
    static_configs:
      - targets:
          - otel-collector:8889
    # The prometheus exporter adds an 'otel_scope_name' label by default;
    # drop it to keep metric cardinality low.
    metric_relabel_configs:
      - action: labeldrop
        regex: otel_scope_(name|version)
