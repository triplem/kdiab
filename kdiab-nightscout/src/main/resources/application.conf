ktor {
    deployment {
        port = 8087
        port = ${?PORT}
    }
    application {
        modules = [ org.javafreedom.kdiab.nightscout.ApplicationKt.module ]
    }
}

jwt {
    domain = "http://localhost:8081/realms/kdiab"
    domain = ${?JWT_DOMAIN}
    jwksUrl = "http://localhost:8081/realms/kdiab/protocol/openid-connect/certs"
    jwksUrl = ${?JWKS_URL}
    audience = "nightscout"
    audience = ${?JWT_AUDIENCE}
    realm = "kdiab"
    realm = ${?JWT_REALM}
    secret = ${?JWT_SECRET}
}

cors {
    allowedOrigins = "http://localhost:3000"
    allowedOrigins = ${?CORS_ALLOWED_ORIGINS}
}

upstream {
    measuresUrl = "http://localhost:8080"
    measuresUrl = ${?MEASURES_URL}
    treatmentsUrl = "http://localhost:8083"
    treatmentsUrl = ${?TREATMENTS_URL}
}

http {
    connectTimeoutMs = 5000
    connectTimeoutMs = ${?HTTP_CONNECT_TIMEOUT_MS}
    requestTimeoutMs = 30000
    requestTimeoutMs = ${?HTTP_REQUEST_TIMEOUT_MS}
    socketTimeoutMs = 5000
    socketTimeoutMs = ${?HTTP_SOCKET_TIMEOUT_MS}
    retryMaxRetries = 3
    retryMaxRetries = ${?HTTP_RETRY_MAX_RETRIES}
    retryMaxDelayMs = 8000
    retryMaxDelayMs = ${?HTTP_RETRY_MAX_DELAY_MS}
}

logging {
    suppressHealthChecks = true
    suppressHealthChecks = ${?LOGGING_SUPPRESS_HEALTH_CHECKS}
}

json {
    prettyPrint = false
    prettyPrint = ${?JSON_PRETTY_PRINT}
}

api3 {
    maxLimit = 1000
    maxLimit = ${?API3_MAX_LIMIT}
    securityEnabled = true
    securityEnabled = ${?API3_SECURITY_ENABLE}
}
