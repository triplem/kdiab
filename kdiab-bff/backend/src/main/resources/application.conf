ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ org.javafreedom.kdiab.bff.ApplicationKt.module ]
    }
}

jwt {
    domain = "http://localhost:8084/realms/kdiab-bff"
    domain = ${?JWT_DOMAIN}
    jwksUrl = "http://localhost:8084/realms/kdiab-bff/protocol/openid-connect/certs"
    jwksUrl = ${?JWKS_URL}
    audience = "bff"
    audience = ${?JWT_AUDIENCE}
    realm = "kdiab-bff"
    realm = ${?JWT_REALM}
    secret = ${?JWT_SECRET}
}

cors {
    allowedOrigins = "http://localhost:3003"
    allowedOrigins = ${?CORS_ALLOWED_ORIGINS}
}

upstream {
    measuresUrl = "http://localhost:8080"
    measuresUrl = ${?MEASURES_URL}
    profilesUrl = "http://localhost:8082"
    profilesUrl = ${?PROFILES_URL}
    treatmentsUrl = "http://localhost:8083"
    treatmentsUrl = ${?TREATMENTS_URL}
}
