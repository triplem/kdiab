services:
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes:
      - ./config/keycloak-realm.json:/opt/keycloak/data/import/realm.json
      - ./config/keycloak-theme:/opt/keycloak/themes/kdiab:ro
    ports:
      - "8085:8080"
    restart: unless-stopped

  bff-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      MEASURES_URL: ${MEASURES_URL:-http://host.docker.internal:8080}
      PROFILES_URL: ${PROFILES_URL:-http://host.docker.internal:8082}
      TREATMENTS_URL: ${TREATMENTS_URL:-http://host.docker.internal:8083}
      JWT_DOMAIN: ${JWT_DOMAIN:-http://localhost:8085/realms/kdiab-bff}
      JWKS_URL: ${JWKS_URL:-http://keycloak:8080/realms/kdiab-bff/protocol/openid-connect/certs}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-bff}
      JWT_REALM: ${JWT_REALM:-kdiab-bff}
    ports:
      - "8084:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      keycloak:
        condition: service_started
    restart: unless-stopped

  bff-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://localhost:8085}
      BACKEND_URL: ${BACKEND_URL:-http://bff-backend:8080}
    ports:
      - "3003:8080"
    depends_on:
      bff-backend:
        condition: service_healthy
    restart: unless-stopped
