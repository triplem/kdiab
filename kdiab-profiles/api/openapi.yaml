openapi: "3.1.0"
info:
  title: T1D Basal Profile Service
  description: Service for managing Type 1 Diabetes basal pump profiles.
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Local Development Server

paths:
  /insulins:
    get:
      summary: Get all insulins
      description: Returns all insulin types available for selection when creating or updating a profile.
      operationId: getInsulins
      responses:
        '200':
          description: A list of insulins
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Insulin'
    post:
      summary: Create a new insulin
      description: Adds a new insulin type to the shared catalogue. Requires ADMIN role.
      operationId: createInsulin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  example: "Novolog"
      responses:
        '201':
          description: Created insulin
          headers:
            Location:
              schema:
                type: string
              description: URL of the created resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Insulin'
        '400':
          description: Invalid name (blank or too long)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Insulin with that name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /insulins/{id}:
    put:
      summary: Update a specific insulin
      description: Renames an existing insulin type. Requires ADMIN role.
      operationId: updateInsulin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
      responses:
        '200':
          description: Updated insulin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Insulin'
        '400':
          description: Invalid name (blank or too long)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden — admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '404':
          description: Insulin not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Insulin with that name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete a specific insulin
      description: Permanently removes an insulin type from the catalogue. Requires ADMIN role.
      operationId: deleteInsulin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Insulin deleted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden — admin role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '404':
          description: Insulin not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/{userId}/profiles:
    get:
      summary: List all profiles for a user
      description: Returns a paginated list of profiles for the given user, optionally filtered by status. Accessible by the user themselves, their assigned doctors, and admins.
      operationId: listProfiles
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
        - name: status
          in: query
          required: false
          description: Filter by profile status. Multiple values allowed. If omitted, all statuses are returned.
          schema:
            type: array
            items:
              type: string
              enum: [DRAFT, PROPOSED, ACTIVE, ARCHIVED]
            default: []
          style: form
          explode: true
      responses:
        '200':
          description: A paginated list of profiles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedProfilesResponse'
    post:
      summary: Create a new profile
      description: Creates a new profile in DRAFT status. A doctor may create a PROPOSED profile for a patient by supplying a proposalReason.
      operationId: createProfile
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProfileRequest'
      responses:
        '201':
          description: Profile created
          headers:
            Location:
              schema:
                type: string
              description: URL of the created resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'

    delete:
      summary: Delete all profiles for a user
      description: Permanently removes all profiles for a user. Restricted to ADMIN role. Use with caution — this is irreversible.
      operationId: deleteProfiles
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: All profiles deleted
        '404':
          description: User not found

  /users/{userId}/profiles/history:
    get:
      summary: Get profile history for a user
      description: Returns all profiles (active and archived) that were valid within the given time range, ordered by validFrom descending. Used to reconstruct which profile was active at any point in time.
      operationId: getProfileHistory
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: List of historical profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Profile'

  /users/{userId}/profiles/{profileId}:
    get:
      summary: Get a specific profile by ID
      description: Returns the full details of a single profile, including all basal, ICR, ISF, and target segments.
      operationId: getProfile
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: profileId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Profile details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '404':
          description: Profile not found
    put:
      summary: Update a profile
      description: Updates an existing profile. If active, creates a new version.
      operationId: updateProfile
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: profileId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Profile'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '404':
          description: Profile not found
    delete:
      summary: Archive a specific profile
      description: Sets the profile status to ARCHIVED. Does not delete data.
      operationId: deleteProfile
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: profileId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Profile deleted
        '404':
          description: Profile not found

  /users/{userId}/profiles/{profileId}/activate:
    post:
      summary: Activate a profile
      description: Sets the profile status to ACTIVE and archives the previously active profile.
      operationId: activateProfile
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: profileId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Profile activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'

  /users/{userId}/profiles/{profileId}/accept:
    post:
      summary: Accept a proposed profile
      description: Sets a PROPOSED profile to ACTIVE and archives the previously active profile.
      operationId: acceptProposedProfile
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: profileId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Profile accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'

  /users/{userId}/profiles/{profileId}/reject:
    post:
      summary: Reject a proposed profile
      description: Sets a PROPOSED profile to ARCHIVED. An optional reason may be provided.
      operationId: rejectProposedProfile
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: profileId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectProfileRequest'
      responses:
        '200':
          description: Profile rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'

  /users/{userId}/profiles/{profileId}/{segmentType}/{startTime}:
    delete:
      summary: Delete a specific segment from a profile
      description: Removes a single time segment (basal, ICR, ISF, or target) from a profile by its start time. Triggers copy-on-write if the profile is ACTIVE.
      operationId: deleteSegment
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: profileId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: segmentType
          in: path
          required: true
          schema:
            type: string
            enum: [basal, icr, isf, targets]
        - name: startTime
          in: path
          required: true
          schema:
            type: string
            pattern: '^([01]\d|2[0-3]):([0-5]\d)$'
      responses:
        '200':
          description: Segment deleted, returns updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '404':
          description: Profile or segment not found


components:
  schemas:
    PagedProfilesResponse:
      type: object
      description: Paginated list of profiles
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Profile'
        page:
          type: integer
          description: Current page number (0-based)
        size:
          type: integer
          description: Number of items per page
        totalCount:
          type: integer
          format: int64
          description: Total number of profiles matching the query
      required:
        - items
        - page
        - size
        - totalCount

    Profile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        previousProfileId:
          type: ["string", "null"]
          format: uuid
        name:
          type: string
        insulinType:
          type: string
        units:
          type: string
          description: Blood glucose unit system used for ISF and target segments
          enum: [mg/dL, mmol/L]
          default: mg/dL
        durationOfAction:
          type: integer
          description: Duration of insulin action in minutes
        timeZone:
          type: string
          description: IANA timezone identifier for segment times (e.g. "Europe/Berlin")
          example: UTC
        status:
          type: string
          enum: [ACTIVE, ARCHIVED, DRAFT, PROPOSED]
        createdAt:
          type: ["string", "null"]
          format: date-time
        validFrom:
          type: ["string", "null"]
          format: date-time
          description: ISO-8601 timestamp of when the profile entered its current status.
        activatedAt:
          type: ["string", "null"]
          format: date-time
          description: ISO-8601 timestamp of when the profile was activated (entered ACTIVE status).
        archivedAt:
          type: ["string", "null"]
          format: date-time
          description: ISO-8601 timestamp of when the profile was archived (entered ARCHIVED status).
        proposalReason:
          type: ["string", "null"]
          description: Optional clinical rationale for the proposed profile change (doctor-only).
        createdBy:
          type: ["string", "null"]
          format: uuid
          description: UUID of the doctor who created this profile proposal (populated server-side for PROPOSED profiles).
        rejectionReason:
          type: ["string", "null"]
          description: Optional reason provided by the patient when rejecting a proposed profile.
        analysisLow:
          type: ["number", "null"]
          format: double
          description: Lower TIR threshold for analytics (mg/dL). Defaults to 70.0 when null.
        analysisHigh:
          type: ["number", "null"]
          format: double
          description: Upper TIR threshold for analytics (mg/dL). Defaults to 180.0 when null.
        carbAbsorptionRateGPerHour:
          type: ["number", "null"]
          format: double
          description: >
            Default carb absorption rate in grams per hour, used for carbs-on-board (COB) calculation
            when a treatment does not specify an explicit absorptionTime.
            Typical values: 10 g/hr (slow/high-fat meal), 20 g/hr (mixed meal), 40 g/hr (fast-acting
            carbs / juice). Defaults to 20.0 when null.
          example: 20.0
        basal:
          type: array
          items:
            $ref: '#/components/schemas/BasalSegment'
        icr:
          type: array
          items:
            $ref: '#/components/schemas/IcrSegment'
        isf:
          type: array
          items:
            $ref: '#/components/schemas/IsfSegment'
        targets:
          type: array
          items:
            $ref: '#/components/schemas/TargetSegment'
      required:
        - id
        - userId
        - name
        - status
        - insulinType
        - durationOfAction

    CreateProfileRequest:
      type: object
      properties:
        name:
          type: string
        insulinType:
          type: string
        durationOfAction:
          type: integer
        proposalReason:
          type: ["string", "null"]
          description: Optional clinical rationale for the proposed profile change (doctor-only).
        analysisLow:
          type: ["number", "null"]
          format: double
          description: Lower TIR threshold for analytics (mg/dL). Defaults to 70.0 when null.
        analysisHigh:
          type: ["number", "null"]
          format: double
          description: Upper TIR threshold for analytics (mg/dL). Defaults to 180.0 when null.
        carbAbsorptionRateGPerHour:
          type: ["number", "null"]
          format: double
          description: >
            Default carb absorption rate in grams per hour. Used for COB calculation when a treatment
            does not specify an explicit absorptionTime. Defaults to 20.0 when null.
          example: 20.0
        basal:
          type: array
          items:
            $ref: '#/components/schemas/BasalSegment'
        icr:
          type: array
          items:
            $ref: '#/components/schemas/IcrSegment'
        isf:
          type: array
          items:
            $ref: '#/components/schemas/IsfSegment'
        targets:
          type: array
          items:
            $ref: '#/components/schemas/TargetSegment'
      required:
        - name
        - insulinType
        - durationOfAction

    BasalSegment:
      type: object
      properties:
        startTime:
          type: string
          pattern: '^([01]\d|2[0-3]):([0-5]\d)$'
        value:
          type: number
          format: double
      required:
        - startTime
        - value

    IcrSegment:
      type: object
      properties:
        startTime:
          type: string
          pattern: '^([01]\d|2[0-3]):([0-5]\d)$'
        value:
          type: number
          format: double
      required:
        - startTime
        - value

    IsfSegment:
      type: object
      properties:
        startTime:
          type: string
          pattern: '^([01]\d|2[0-3]):([0-5]\d)$'
        value:
          type: number
          format: double
      required:
        - startTime
        - value

    TargetSegment:
      type: object
      properties:
        startTime:
          type: string
          pattern: '^([01]\d|2[0-3]):([0-5]\d)$'
        low:
          type: number
          format: double
        high:
          type: number
          format: double
      required:
        - startTime
        - low
        - high

    RejectProfileRequest:
      type: object
      properties:
        reason:
          type: ["string", "null"]
          description: Optional reason for rejecting the proposed profile.

    Insulin:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
        - id
        - name

    ErrorResponse:
      type: object
      description: Standard error envelope returned by all error responses
      properties:
        code:
          type: integer
          description: HTTP status code
        message:
          type: string
          description: Human-readable error description
      required:
        - code
        - message

    RateLimitErrorResponse:
      type: object
      description: Error envelope returned when the rate limit is exceeded
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Error code identifier
          example: RATE_LIMIT_EXCEEDED
        message:
          type: string
          description: Human-readable error description
          example: Too many requests

  responses:
    TooManyRequests:
      description: Too Many Requests
      headers:
        X-RateLimit-Limit:
          schema:
            type: integer
          description: Maximum requests per window
        X-RateLimit-Remaining:
          schema:
            type: integer
          description: Remaining requests in current window
        Retry-After:
          schema:
            type: integer
          description: Seconds until the rate limit resets
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RateLimitErrorResponse'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []
